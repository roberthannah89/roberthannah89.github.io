<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit widget v3 — Google style</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="proto-title" content="Transit Widget v3 (Google-style)">
<meta name="proto-icon" content="&#x1F684;">
<meta name="proto-desc" content="Google Maps–style transit results: list of options, drill into a vertical timeline with stop-by-stop detail">
<meta name="proto-source" content="transport.opendata.ch">
<meta name="proto-order" content="146">
<style>
  :root {
    --bg: #0b0c10;
    --card-bg: #ffffff;
    --card-fg: #202124;
    --muted-fg: #5f6368;
    --link: #1a73e8;
    --border: #e8eaed;
    --hover: #f8f9fa;
    --selected-border: #009688;
    --line-default: #1a73e8;
    --walk-color: #4ab1ea;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Google Sans", sans-serif;
    color: #e8e8ea;
    padding: 1.5rem 1rem 3rem;
    min-height: 100vh;
  }
  .page-header { max-width: 720px; margin: 0 auto 1rem; }
  .page-header h1 { font-size: 1.05rem; margin: 0 0 .25rem; font-weight: 600; }
  .page-header p { font-size: .85rem; color: #a0a4ad; margin: 0; }
  .page-header code { color: #ffb3b3; }

  .controls {
    max-width: 720px;
    margin: 0 auto 1.25rem;
    background: #14161c;
    border: 1px solid #23262e;
    border-radius: 10px;
    padding: .75rem;
    display: grid;
    grid-template-columns: 1fr 1fr 130px 105px;
    gap: .55rem .65rem;
    align-items: end;
  }
  .controls label {
    font-size: .65rem; letter-spacing: .08em; text-transform: uppercase;
    color: #a0a4ad; margin-bottom: .2rem; display: block;
  }
  .controls input {
    width: 100%; background: #1d1f27; color: #e8e8ea;
    border: 1px solid #23262e; border-radius: 6px;
    padding: .5rem .6rem; font: inherit; font-size: .9rem;
  }
  .controls input:focus { outline: 1px solid #ff5c5c; }
  .controls button {
    grid-column: 1 / -1;
    background: #ff5c5c; color: #fff; border: 0; border-radius: 6px;
    padding: .6rem; font: inherit; font-size: .9rem; font-weight: 500; cursor: pointer;
  }
  .controls button:hover { background: #e84a4a; }

  /* The white "Google card" */
  .gcard {
    max-width: 720px; margin: 0 auto;
    background: var(--card-bg); color: var(--card-fg);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.45);
  }
  .gcard a { color: var(--link); text-decoration: none; }
  .gcard a:hover { text-decoration: underline; }

  /* Top toolbar (Send directions + Copy link) */
  .gtoolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: .8rem 1rem .25rem;
    font-size: .9rem;
    font-weight: 500;
  }
  .gtoolbar a { display: flex; align-items: center; gap: .4rem; }
  .gtoolbar svg { width: 18px; height: 18px; }

  /* Result rows */
  .grow {
    display: grid;
    grid-template-columns: 38px 1fr auto;
    gap: .9rem;
    padding: 1rem;
    border-top: 1px solid var(--border);
    align-items: flex-start;
    cursor: pointer;
    border-left: 4px solid transparent;
  }
  .grow:hover { background: var(--hover); }
  .grow.selected { border-left-color: var(--selected-border); }
  .grow.expanded { background: var(--hover); }
  .grow.expanded .details-link { display: none; }
  .grow .icon-mode { color: var(--card-fg); margin-top: 2px; }
  .grow .icon-mode svg { width: 28px; height: 28px; }
  .grow .times { font-weight: 500; font-size: 1.05rem; line-height: 1.2; }
  .grow .duration { font-weight: 500; font-size: 1.05rem; color: var(--card-fg); white-space: nowrap; padding-top: 1px; }
  .grow .chips { margin-top: .4rem; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
  .grow .meta { margin-top: .45rem; font-size: .85rem; color: var(--muted-fg); }
  .grow .meta .walk { display: inline-flex; align-items: center; gap: .25rem; margin-top: .15rem; }
  .grow .meta .walk svg { width: 14px; height: 14px; }
  .grow .details-link { margin-top: .65rem; font-weight: 500; }

  /* Line chips (Google style: small mode icon + colored label box) */
  .lc {
    display: inline-flex; align-items: center; gap: .35rem;
    background: transparent; color: var(--card-fg);
  }
  .lc-icon svg { width: 18px; height: 18px; display: block; }
  .lc-label {
    padding: 1px 7px; border-radius: 3px;
    font-size: .78rem; font-weight: 700; color: #fff;
    line-height: 1.5; letter-spacing: .01em;
  }
  .lc-sep {
    color: var(--muted-fg); display: inline-flex; align-items: center;
    padding: 0 .1rem; font-size: .85rem;
  }

  /* ===== Detail view ===== */
  .detail { padding: .85rem 1rem 1rem; }
  .detail-back {
    display: inline-flex; align-items: center; gap: .35rem;
    margin: 0 0 .8rem -.4rem;
    background: transparent; border: 0; padding: .4rem .5rem;
    font: inherit; color: var(--link); cursor: pointer;
    border-radius: 4px;
  }
  .detail-back:hover { background: var(--hover); }

  .detail-header-actions {
    display: flex; gap: 1rem; align-items: center; margin-bottom: .35rem;
    color: var(--card-fg);
  }
  .detail-header-actions svg { width: 22px; height: 22px; cursor: pointer; }
  .detail-header-actions .grow-spacer { flex: 1; }

  .detail-times { font-size: 1.5rem; font-weight: 500; }
  .detail-duration { font-size: 1rem; color: var(--muted-fg); margin-top: 0; }
  .detail-chips { margin-top: .65rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .detail-from { margin-top: .7rem; font-size: .9rem; color: var(--muted-fg); }
  .detail-walk {
    margin-top: .2rem; font-size: .9rem; color: var(--muted-fg);
    display: flex; align-items: center; gap: .3rem;
  }
  .detail-walk svg { width: 14px; height: 14px; }

  .add-cal {
    display: flex; align-items: center; gap: .55rem;
    padding: .9rem 0;
    margin-top: .85rem;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    color: var(--link); font-weight: 500;
  }
  .add-cal svg { width: 22px; height: 22px; }

  /* Timeline */
  .timeline {
    display: grid;
    grid-template-columns: 60px 24px 1fr;
    margin-top: 1rem;
    row-gap: 0;
  }
  .tl-time {
    text-align: right; padding-right: .65rem;
    font-size: .85rem; color: var(--muted-fg);
    padding-top: .2rem;
    white-space: nowrap;
  }
  .tl-axis {
    position: relative;
    min-height: 28px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .tl-axis-line {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 0;
    border-left: 4px solid var(--line-default);
    transform: translateX(-2px);
  }
  .tl-axis-line.dotted {
    border-left-style: dotted;
    border-left-width: 4px;
    border-left-color: var(--walk-color);
  }
  .tl-dot {
    position: relative; z-index: 1;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 3px solid var(--line-default);
    margin-top: 2px;
  }
  .tl-dot.terminus {
    background: var(--card-fg); border-color: var(--card-fg);
    width: 18px; height: 18px;
    box-shadow: inset 0 0 0 3px #fff;
    margin-top: 0;
  }
  .tl-text { padding: .1rem 0 0 .35rem; }
  .tl-station { font-weight: 500; font-size: 1rem; line-height: 1.3; }
  .tl-station-sub { font-size: .82rem; color: var(--muted-fg); }

  .tl-leg {
    padding: .5rem 0 .5rem .35rem;
  }
  .tl-leg-row {
    display: flex; align-items: center; gap: .55rem;
  }
  .tl-leg-row .tl-mode-icon svg { width: 24px; height: 24px; }
  .tl-leg-dest { font-weight: 500; }
  .tl-leg-detail {
    font-size: .85rem; color: var(--muted-fg); margin-top: .25rem;
    display: flex; align-items: center; gap: .25rem;
  }
  .tl-leg-detail .caret { font-size: .7rem; opacity: .7; }

  .tl-walk-row {
    display: flex; align-items: center; gap: .5rem;
  }
  .tl-walk-row svg { width: 18px; height: 18px; }

  /* Section separators between rows */
  .tl-sep {
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--border);
    margin: .3rem 0;
  }

  /* Tickets footer */
  .tickets {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  .tickets h3 { font-size: .98rem; font-weight: 600; margin: 0 0 .55rem; color: var(--card-fg); }
  .tickets-list { display: flex; flex-direction: column; gap: .2rem; font-size: .9rem; }

  /* Inline expanded panel under a row */
  .grow-expanded-panel {
    grid-column: 1 / -1;
    margin-top: .35rem;
    padding-top: .25rem;
    border-top: 1px solid var(--border);
  }
  .expanded-actions {
    display: flex; gap: 1.5rem; align-items: center;
    padding: .8rem 0 .25rem;
    color: var(--card-fg);
    font-size: .92rem;
    font-weight: 500;
  }
  .expanded-actions a {
    color: var(--card-fg); display: inline-flex; align-items: center; gap: .35rem;
    cursor: pointer;
  }
  .expanded-actions a:hover { color: var(--link); text-decoration: none; }
  .expanded-actions svg { width: 20px; height: 20px; }
  .expanded-actions .add-cal-link { margin-left: auto; color: var(--link); }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #202124; color: #fff;
    padding: .65rem 1.1rem; border-radius: 4px;
    font-size: .9rem; font-weight: 500;
    z-index: 9999;
    transition: transform .25s ease;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .empty, .loading, .err {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted-fg);
  }
  .err { color: #d33; }
</style>
</head>
<body>

<header class="page-header">
  <h1>Public transport — prototype v3 <span style="color:#a0a4ad;font-weight:400;">(Google-style)</span></h1>
  <p>List of options + drill into a stop-by-stop timeline, modeled on Google Maps transit. Live data from <code>transport.opendata.ch</code>.</p>
</header>

<form class="controls" id="controls">
  <div><label>From</label><input id="i-from" value="Zürich HB"></div>
  <div><label>To</label><input id="i-to" value="Wangen SZ"></div>
  <div><label>Date</label><input id="i-date" type="date"></div>
  <div><label>Time</label><input id="i-time" type="time"></div>
  <button type="submit">Search</button>
</form>

<div class="gcard" id="gcard">
  <div class="loading">Loading…</div>
</div>

<script>
(function() {
  'use strict';

  // ===== Inline SVG icons =====
  var ICON_TRAIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 15.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V5c0-3.5-3.58-4-8-4s-8 .5-8 4v10.5zm8 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm6-7H6V5h12v5z"/></svg>';
  var ICON_BUS = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>';
  var ICON_TRAM = ICON_TRAIN;
  var ICON_SHIP = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.68c.08-.26.06-.54-.06-.78s-.34-.42-.6-.5L20 10.62V6c0-1.1-.9-2-2-2h-3V1H9v3H6c-1.1 0-2 .9-2 2v4.62l-1.29.42c-.26.08-.48.26-.6.5s-.15.52-.06.78L3.95 19zM6 6h12v3.97L12 8 6 9.97V6z"/></svg>';
  var ICON_CABLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5l18-2v3l-9 1v2.59l9.5-1.05V12L12 13.41V18l4-1v3l-13 1.5v-3L11 17v-3.5l-8-1.04V9.44L11 10.5V8L3 9V5z"/></svg>';
  var ICON_WALK = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="13" cy="4" r="2"/><path d="M13.5 5.5h-3l-3.5 7 .8 4 4-3.5L13 16v6h2v-7l-2.5-1.5.6-3 2.4 2.5h3v-2h-2.5l-1.4-2.4-.5-1.1z"/></svg>';
  var ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM7 12h5v5H7z"/></svg>';
  var ICON_PRINT = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>';
  var ICON_SHARE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';
  var ICON_MOBILE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 1h-8C6.12 1 5 2.12 5 3.5v17C5 21.88 6.12 23 7.5 23h8c1.38 0 2.5-1.12 2.5-2.5v-17C18 2.12 16.88 1 15.5 1zm-4 21c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM16 18H7V4h9v14z"/></svg>';
  var ICON_LINK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>';
  var ICON_CARET = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 10l5 5 5-5z"/></svg>';

  // ===== ZVV S-Bahn line colors (Google-like, per-line) =====
  var S_COLORS = {
    '1':  '#4eb8e5', '2':  '#10a652', '3':  '#f4a83a', '4':  '#f4a83a',
    '5':  '#88533a', '6':  '#2b62a8', '7':  '#7a3a8f', '8':  '#5a23a8',
    '9':  '#10a652', '12': '#e8252e', '14': '#d92e8f', '15': '#4eb8e5',
    '16': '#88533a', '24': '#d92e8f', '25': '#c81e8f'
  };
  function modeOf(journey) {
    if (!journey) return { kind: 'walk', icon: ICON_WALK };
    var c = (journey.category || '').toUpperCase().trim();
    if (/^(IC|ICE|EC|TGV|RJ|RJX|PE|EXT|NJ|IR|RE)$/.test(c)) return { kind: 'train', icon: ICON_TRAIN };
    if (/^S\d*$|^SN$/.test(c))                              return { kind: 'train', icon: ICON_TRAIN };
    if (/^(B|BUS|NFB|KB|BN)$/.test(c))                      return { kind: 'bus',   icon: ICON_BUS };
    if (/^(T|TRAM|NFT|M)$/.test(c))                         return { kind: 'tram',  icon: ICON_TRAM };
    if (/^(BAT|FAE|SCH|FB)$/.test(c))                       return { kind: 'ship',  icon: ICON_SHIP };
    if (/^(GB|PB|FUN|SL|LB|ASC)$/.test(c))                  return { kind: 'cable', icon: ICON_CABLE };
    return { kind: 'train', icon: ICON_TRAIN };
  }
  function lineLabelOf(journey) {
    if (!journey) return '';
    var cat = (journey.category || '').trim();
    var num = (journey.number || '').trim();
    var m = modeOf(journey);
    if (m.kind === 'bus' || m.kind === 'tram') return num || cat || (journey.name || '').trim();
    if (cat && num) return cat + num;
    return cat || (journey.name || '').trim() || 'Train';
  }
  function lineColorOf(journey) {
    if (!journey) return 'var(--walk-color)';
    var cat = (journey.category || '').toUpperCase().trim();
    var num = (journey.number || '').trim();
    var m = modeOf(journey);
    if (m.kind === 'bus')   return '#fdd700';
    if (m.kind === 'tram')  return '#2b62a8';
    if (m.kind === 'ship')  return '#00a3d8';
    if (m.kind === 'cable') return '#5da93d';
    if (/^S/.test(cat)) return S_COLORS[num] || '#5a23a8';
    return '#e8252e';
  }
  function lineFgOf(color) {
    return color === '#fdd700' ? '#202124' : '#fff';
  }

  // ===== Time helpers =====
  function parseISO(s) { return s ? new Date(s) : null; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTime(d) {
    if (!d) return '';
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + pad2(m) + ' ' + ampm;
  }
  function parseDur(s) {
    if (!s) return 0;
    var m = /^(\d+)d(\d+):(\d+):(\d+)$/.exec(s);
    if (!m) return 0;
    return (+m[1]) * 86400 + (+m[2]) * 3600 + (+m[3]) * 60 + (+m[4]);
  }
  function fmtDur(secs) {
    var h = Math.floor(secs / 3600), m = Math.round((secs % 3600) / 60);
    if (h === 0) return m + ' min';
    if (m === 0) return h === 1 ? '1 hr' : h + ' hr';
    return (h === 1 ? '1 hr ' : h + ' hr ') + m + ' min';
  }
  function legDurationSecs(sec) {
    var dep = sec.departure && parseISO(sec.departure.departure);
    var arr = sec.arrival && parseISO(sec.arrival.arrival);
    if (!dep || !arr) return 0;
    return Math.max(0, Math.round((arr - dep) / 1000));
  }

  // ===== API =====
  function fetchConnections(from, to, date, time, cb) {
    var url = 'https://transport.opendata.ch/v1/connections'
      + '?from=' + encodeURIComponent(from)
      + '&to=' + encodeURIComponent(to)
      + '&date=' + encodeURIComponent(date)
      + '&time=' + encodeURIComponent(time)
      + '&limit=6';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { cb(null, JSON.parse(xhr.responseText)); }
        catch (e) { cb(e); }
      } else cb(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function() { cb(new Error('network')); };
    xhr.ontimeout = function() { cb(new Error('timeout')); };
    xhr.send();
  }

  // ===== DOM helpers =====
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function(k) {
      if (k === 'class') e.className = props[k];
      else if (k === 'html') e.innerHTML = props[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function(k) {
      if (k == null) return;
      e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
    });
    return e;
  }
  function chip(journey) {
    var color = lineColorOf(journey);
    return el('span', { class: 'lc' }, [
      el('span', { class: 'lc-icon', html: modeOf(journey).icon }),
      el('span', {
        class: 'lc-label',
        style: 'background:' + color + ';color:' + lineFgOf(color)
      }, lineLabelOf(journey))
    ]);
  }
  function chipSep() { return el('span', { class: 'lc-sep', html: '&rsaquo;' }); }
  function iconSpan(svg) { return el('span', { class: 'lc-icon', html: svg }); }

  // ===== List view =====
  function renderList(connections) {
    var card = document.getElementById('gcard');
    card.innerHTML = '';
    if (!connections || !connections.length) {
      card.appendChild(el('div', { class: 'empty' }, 'No connections found.'));
      return;
    }

    var toolbar = el('div', { class: 'gtoolbar' }, [
      el('span'),
      el('a', { href: '#', onclick: function(e) { prevent(e); copyLink(); } },
        [iconSpan(ICON_LINK), 'Copy link'])
    ]);
    card.appendChild(toolbar);

    connections.forEach(function(c, i) {
      card.appendChild(renderRow(c, i, i === state.expandedIdx));
    });
  }

  function renderRow(c, idx, isExpanded) {
    var transitSecs = (c.sections || []).filter(function(s) { return s.journey; });
    var firstJourney = transitSecs[0] && transitSecs[0].journey;
    var modeIcon = modeOf(firstJourney).icon;
    var dep = parseISO(c.from && c.from.departure);
    var arr = parseISO(c.to && c.to.arrival);
    var totalSecs = parseDur(c.duration);

    var chipsRow = el('div', { class: 'chips' });
    transitSecs.forEach(function(s, i) {
      if (i > 0) chipsRow.appendChild(chipSep());
      chipsRow.appendChild(chip(s.journey));
    });

    var meta = el('div', { class: 'meta' });
    if (dep) {
      meta.appendChild(el('div', null, fmtTime(dep) + ' from ' + (c.from.station && c.from.station.name || '')));
    }
    var firstSec = c.sections && c.sections[0];
    if (firstSec && firstSec.walk) {
      var walkMin = Math.max(1, Math.round((firstSec.walk.duration || 60) / 60));
      meta.appendChild(el('div', { class: 'walk' }, [iconSpan(ICON_WALK), walkMin + ' min']));
    }

    var noneExpanded = (state.expandedIdx === -1);
    var showDetailsHint = (idx === 0 && noneExpanded);
    var rowClass = 'grow'
      + (isExpanded ? ' selected expanded' : '')
      + ((!isExpanded && idx === 0 && noneExpanded) ? ' selected' : '');

    var row = el('div', { class: rowClass }, [
      el('div', { class: 'icon-mode', html: modeIcon }),
      el('div', null, [
        el('div', { class: 'times' }, fmtTime(dep) + ' — ' + fmtTime(arr)),
        chipsRow,
        meta,
        showDetailsHint ? el('div', { class: 'details-link' }, 'Details') : null
      ]),
      el('div', { class: 'duration' }, fmtDur(totalSecs))
    ]);

    if (isExpanded) row.appendChild(renderExpandedPanel(c));

    row.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;
      state.expandedIdx = isExpanded ? -1 : idx;
      renderList(lastConnections);
    });

    return row;
  }

  // ===== Expanded panel (inline detail) =====
  function renderExpandedPanel(c) {
    var panel = el('div', { class: 'grow-expanded-panel' });

    var actions = el('div', { class: 'expanded-actions' }, [
      el('a', { href: '#', title: 'Share', onclick: function(e) { prevent(e); shareTrip(c); } },
        [iconSpan(ICON_SHARE), 'Share']),
      el('a', { href: '#', title: 'Print', onclick: function(e) { prevent(e); window.print(); } },
        [iconSpan(ICON_PRINT), 'Print']),
      el('a', { href: '#', class: 'add-cal-link', onclick: function(e) { prevent(e); downloadIcs(c); } },
        [iconSpan(ICON_CALENDAR), 'Add to Calendar'])
    ]);
    panel.appendChild(actions);

    panel.appendChild(renderTimeline(c));

    var tickets = el('div', { class: 'tickets' });
    tickets.appendChild(el('h3', null, 'Tickets and information'));
    var sbbHref = 'https://www.sbb.ch/en?stops[0].value=' +
      encodeURIComponent((c.from && c.from.station && c.from.station.name) || '') +
      '&stops[1].value=' +
      encodeURIComponent((c.to && c.to.station && c.to.station.name) || '');
    tickets.appendChild(el('div', null,
      el('a', { href: sbbHref, target: '_blank', rel: 'noopener' },
        'Schweizerische Bundesbahnen \u2014 Buy tickets')));
    panel.appendChild(tickets);

    return panel;
  }

  function renderTimeline(c) {
    var tl = el('div', { class: 'timeline' });
    var sections = c.sections || [];
    var lastIdx = sections.length - 1;

    sections.forEach(function(s, i) {
      var isWalk = !!s.walk;
      var legColor = isWalk ? 'var(--walk-color)' : lineColorOf(s.journey);
      var legCss = 'tl-axis-line' + (isWalk ? ' dotted' : '');

      var depDate = s.departure && parseISO(s.departure.departure);
      var depName = (s.departure && s.departure.station && s.departure.station.name) || '';

      // === Departure-station row ===
      tl.appendChild(el('div', { class: 'tl-time' }, depDate ? fmtTime(depDate) : ''));
      tl.appendChild(el('div', { class: 'tl-axis' }, [
        el('div', { class: legCss, style: isWalk ? '' : ('border-left-color:' + legColor) }),
        el('div', {
          class: 'tl-dot',
          style: 'border-color:' + (isWalk ? 'var(--walk-color)' : legColor)
        })
      ]));
      tl.appendChild(el('div', { class: 'tl-text' }, [
        el('div', { class: 'tl-station' }, depName),
        i === 0 ? el('div', { class: 'tl-station-sub' }, 'Switzerland') : null
      ]));

      // === Leg row ===
      tl.appendChild(el('div', { class: 'tl-time' }, ''));
      tl.appendChild(el('div', { class: 'tl-axis' }, [
        el('div', { class: legCss, style: isWalk ? '' : ('border-left-color:' + legColor) })
      ]));

      var legBody = el('div', { class: 'tl-leg' });
      if (isWalk) {
        legBody.appendChild(el('div', { class: 'tl-walk-row' }, [iconSpan(ICON_WALK), 'Walk']));
        var dur = s.walk && s.walk.duration;
        legBody.appendChild(el('div', { class: 'tl-leg-detail' }, [
          el('span', { class: 'caret', html: ICON_CARET }),
          'About ' + Math.max(1, Math.round((dur || 60) / 60)) + ' min'
        ]));
      } else {
        var j = s.journey;
        var head = el('div', { class: 'tl-leg-row' }, [
          el('span', { class: 'tl-mode-icon', html: modeOf(j).icon }),
          chip(j),
          el('span', { class: 'tl-leg-dest' }, j.to || '')
        ]);
        legBody.appendChild(head);

        var legSecs = legDurationSecs(s);
        var stops = (j.passList && j.passList.length) ? (j.passList.length - 2) : null;
        var det = fmtDur(legSecs);
        if (stops === 0) det += ' (non-stop)';
        else if (stops != null && stops > 0) det += ' (' + stops + ' stop' + (stops === 1 ? '' : 's') + ')';
        var plat = s.departure && s.departure.platform;
        if (plat) det += ' · Platform ' + plat;
        legBody.appendChild(el('div', { class: 'tl-leg-detail' }, [
          el('span', { class: 'caret', html: ICON_CARET }),
          det
        ]));
      }
      tl.appendChild(legBody);

      // === Final arrival row (last section only) ===
      if (i === lastIdx) {
        var arrDate = s.arrival && parseISO(s.arrival.arrival);
        var arrName = (s.arrival && s.arrival.station && s.arrival.station.name) || '';
        tl.appendChild(el('div', { class: 'tl-time' }, arrDate ? fmtTime(arrDate) : ''));
        tl.appendChild(el('div', { class: 'tl-axis' }, [
          el('div', { class: 'tl-dot terminus' })
        ]));
        tl.appendChild(el('div', { class: 'tl-text' }, [
          el('div', { class: 'tl-station' }, arrName),
          el('div', { class: 'tl-station-sub' }, 'Switzerland')
        ]));
      }
    });
    return tl;
  }

  // ===== Wiring =====
  var lastConnections = null;
  var state = { expandedIdx: 0 };

  function prevent(e) { if (e) { e.preventDefault(); e.stopPropagation(); } }

  function buildShareLink() {
    var from = document.getElementById('i-from').value;
    var to   = document.getElementById('i-to').value;
    var date = document.getElementById('i-date').value;
    var time = document.getElementById('i-time').value;
    return location.origin + location.pathname + '#'
      + 'from=' + encodeURIComponent(from)
      + '&to='   + encodeURIComponent(to)
      + '&date=' + encodeURIComponent(date)
      + '&time=' + encodeURIComponent(time);
  }
  function copyLink() {
    var url = buildShareLink();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function() { showToast('Link copied'); },
        function() { fallbackCopy(url); }
      );
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('Link copied'); }
    catch (e) { showToast('Could not copy'); }
    document.body.removeChild(ta);
  }
  function shareTrip(c) {
    var url = buildShareLink();
    var fromName = (c.from && c.from.station && c.from.station.name) || '';
    var toName = (c.to && c.to.station && c.to.station.name) || '';
    if (navigator.share) {
      navigator.share({
        title: fromName + ' \u2192 ' + toName,
        text: 'Transit trip',
        url: url
      }).catch(function() { copyLink(); });
    } else {
      copyLink();
    }
  }
  function showToast(msg) {
    var t = el('div', { class: 'toast' }, msg);
    document.body.appendChild(t);
    setTimeout(function() { t.classList.add('show'); }, 10);
    setTimeout(function() {
      t.classList.remove('show');
      setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
    }, 1800);
  }

  function icsDate(d) {
    if (!d) return '';
    return '' + d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate())
      + 'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }
  function icsEscape(t) {
    return String(t || '').replace(/[\\;,]/g, function(m) { return '\\' + m; }).replace(/\n/g, '\\n');
  }
  function downloadIcs(c) {
    var dep = parseISO(c.from && c.from.departure);
    var arr = parseISO(c.to && c.to.arrival);
    var fromName = (c.from && c.from.station && c.from.station.name) || '';
    var toName = (c.to && c.to.station && c.to.station.name) || '';
    var transitSecs = (c.sections || []).filter(function(s) { return s.journey; });
    var chips = transitSecs.map(function(s) { return lineLabelOf(s.journey); }).join(' \u2192 ');
    var totalSecs = parseDur(c.duration);
    var desc = chips + ' (' + fmtDur(totalSecs) + ')';
    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//hike//transit-widget-v3//EN',
      'BEGIN:VEVENT',
      'UID:' + (dep ? dep.getTime() : Date.now()) + '@hike-transit',
      'DTSTAMP:' + icsDate(new Date()),
      'DTSTART:' + icsDate(dep),
      'DTEND:' + icsDate(arr),
      'SUMMARY:' + icsEscape(fromName + ' \u2192 ' + toName),
      'LOCATION:' + icsEscape(fromName),
      'DESCRIPTION:' + icsEscape(desc),
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'trip-' + (dep ? dep.toISOString().slice(0,10) : 'transit') + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 0);
  }

  function parseHashIntoForm() {
    if (!location.hash || location.hash.length < 2) return false;
    var params = {};
    location.hash.slice(1).split('&').forEach(function(p) {
      var idx = p.indexOf('=');
      if (idx > -1) params[p.slice(0, idx)] = decodeURIComponent(p.slice(idx + 1));
    });
    var any = false;
    if (params.from) { document.getElementById('i-from').value = params.from; any = true; }
    if (params.to)   { document.getElementById('i-to').value   = params.to;   any = true; }
    if (params.date) { document.getElementById('i-date').value = params.date; any = true; }
    if (params.time) { document.getElementById('i-time').value = params.time; any = true; }
    return any;
  }

  function doSearch() {
    var from = document.getElementById('i-from').value;
    var to   = document.getElementById('i-to').value;
    var date = document.getElementById('i-date').value;
    var time = document.getElementById('i-time').value;
    var card = document.getElementById('gcard');
    card.innerHTML = '<div class="loading">Loading\u2026</div>';
    state.expandedIdx = 0;
    fetchConnections(from, to, date, time, function(err, data) {
      if (err) {
        card.innerHTML = '<div class="err">' + (err.message || 'Error') + '</div>';
        return;
      }
      lastConnections = data.connections || [];
      renderList(lastConnections);
    });
  }
  document.getElementById('controls').addEventListener('submit', function(e) {
    e.preventDefault();
    doSearch();
  });

  // Default date/time = now (unless hash overrides)
  var now = new Date();
  document.getElementById('i-date').value =
    now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
  document.getElementById('i-time').value = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  parseHashIntoForm();

  doSearch();
})();
</script>
</body>
</html>
