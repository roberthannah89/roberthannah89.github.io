<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="proto-title" content="Swiss Transit">
<meta name="proto-icon" content="&#x1F682;">
<meta name="proto-desc" content="Live SBB/public transport connections and station search">
<meta name="proto-source" content="transport.opendata.ch">
<meta name="proto-order" content="40">
<title>Swiss Transit Widget Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board-bg: #1a1810;
    --board-surface: #242118;
    --flap-bg: #2c2820;
    --flap-border: #3a3428;
    --amber: #e8a832;
    --amber-dim: #b8862a;
    --amber-glow: #e8a83240;
    --red: #e63228;
    --red-dim: #c42a22;
    --green: #48b848;
    --text-primary: #f0e8d8;
    --text-secondary: #a89878;
    --text-muted: #786848;
    --font-display: 'Familjen Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--board-bg);
    color: var(--text-primary);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  /* — Noise overlay — */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
  }

  .widget {
    width: 100%;
    max-width: 680px;
  }

  /* — Header — */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--flap-border);
  }

  .header-icon {
    width: 48px;
    height: 48px;
    background: var(--red);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
    font-family: var(--font-mono);
    letter-spacing: -1px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px #e6322840;
  }

  .header-text h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .header-text p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .header-clock {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 600;
    color: var(--amber);
    text-shadow: 0 0 20px var(--amber-glow);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* — Route selector — */
  .route-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    grid-template-rows: auto auto;
    gap: 10px;
    margin-bottom: 16px;
    align-items: stretch;
  }

  .route-bar .station-input.from { grid-column: 1; grid-row: 1; }
  .route-bar .swap-btn            { grid-column: 2; grid-row: 1 / span 2; }
  .route-bar .station-input.to    { grid-column: 3; grid-row: 1; }
  .route-bar .station-input.via   { grid-column: 1 / span 3; grid-row: 2; }
  .route-bar .btn-search          { grid-column: 4; grid-row: 1 / span 2; }

  .station-input {
    position: relative;
  }

  .station-input label {
    position: absolute;
    top: 8px;
    left: 14px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
    pointer-events: none;
  }

  .station-input input {
    width: 100%;
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    padding: 26px 36px 10px 14px;
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s;
  }

  .station-input input:focus {
    border-color: var(--amber-dim);
  }

  /* Tiny clear (×) inside each station input */
  .station-input .clear-x {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: none;
    transition: color 0.15s, background 0.15s;
  }
  .station-input .clear-x:hover { color: var(--text-primary); background: var(--board-surface); }
  .station-input.has-value .clear-x { display: block; }

  /* Autocomplete dropdown */
  .suggest {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--board-surface);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    max-height: 280px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .suggest[data-open="1"] { display: block; }
  .suggest-item {
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    border-bottom: 1px solid var(--flap-border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover,
  .suggest-item.active { background: var(--flap-bg); color: var(--amber); }
  .suggest-item .sx-kind {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    align-self: center;
  }
  .suggest-empty { padding: 10px 14px; color: var(--text-muted); font-style: italic; font-size: 12px; }

  /* Swap From↔To button */
  .swap-btn {
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    width: 42px;
    transition: color 0.15s, border-color 0.15s, transform 0.25s;
  }
  .swap-btn:hover { color: var(--amber); border-color: var(--amber-dim); }
  .swap-btn:active { transform: rotate(180deg); }

  .btn-search {
    align-self: stretch;
    background: var(--amber);
    color: var(--board-bg);
    border: none;
    border-radius: 6px;
    padding: 0 22px;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-search:hover { background: #f0b840; }
  .btn-search:active { transform: scale(0.97); }

  /* — When / Via row — */
  .when-bar {
    display: grid;
    grid-template-columns: auto auto auto 1fr;
    gap: 10px;
    margin-bottom: 24px;
    align-items: stretch;
  }
  .when-toggle {
    display: inline-flex;
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }
  .when-toggle button {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .when-toggle button[aria-pressed="true"] {
    background: var(--board-surface);
    color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--amber-dim);
  }
  .when-bar input[type="date"],
  .when-bar input[type="time"] {
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    color-scheme: dark;
  }
  .when-bar input:focus { border-color: var(--amber-dim); }
  .when-now {
    background: transparent;
    border: 1px dashed var(--flap-border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    padding: 0 14px;
    cursor: pointer;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s;
    justify-self: end;
  }
  .when-now:hover { color: var(--amber); border-color: var(--amber-dim); }

  /* — Connections list — */
  .connections {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .conn {
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 90px 1fr 90px;
    align-items: center;
    gap: 16px;
    animation: flap-in 0.35s cubic-bezier(0.22, 0.68, 0.36, 1) both;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .conn:hover { border-color: var(--amber-dim); background: #322d22; }
  .conn.open { border-color: var(--amber-dim); }
  .conn .conn-chevron {
    position: absolute;
    right: 8px;
    top: 8px;
    color: var(--text-muted);
    font-size: 10px;
    transition: transform 0.25s;
  }
  .conn.open .conn-chevron { transform: rotate(90deg); color: var(--amber); }

  .conn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--green);
    opacity: 0.7;
  }

  .conn.delayed::before { background: var(--red); }

  .conn:nth-child(1) { animation-delay: 0s; }
  .conn:nth-child(2) { animation-delay: 0.06s; }
  .conn:nth-child(3) { animation-delay: 0.12s; }
  .conn:nth-child(4) { animation-delay: 0.18s; }
  .conn:nth-child(5) { animation-delay: 0.24s; }
  .conn:nth-child(6) { animation-delay: 0.30s; }

  @keyframes flap-in {
    from {
      opacity: 0;
      transform: rotateX(-40deg) translateY(-8px);
    }
    to {
      opacity: 1;
      transform: rotateX(0) translateY(0);
    }
  }

  .conn-depart {
    text-align: center;
  }

  .conn-time {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--amber);
    text-shadow: 0 0 16px var(--amber-glow);
    line-height: 1;
  }

  .conn-platform {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .conn-delay {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
    margin-top: 2px;
  }

  .conn-middle {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .conn-route {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .conn-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--board-surface);
    border: 1px solid var(--flap-border);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .conn-badge.train { color: var(--red); border-color: var(--red-dim); }
  .conn-badge.bus { color: #58a8e8; border-color: #386888; }
  .conn-badge.ship { color: #68c8a8; border-color: #388868; }
  .conn-badge.tram { color: #c888e8; border-color: #886898; }
  .conn-badge.cable { color: #e8c858; border-color: #a89838; }
  .conn-badge.walk { color: var(--text-secondary); font-style: italic; }

  .conn-arrow {
    color: var(--text-muted);
    font-size: 10px;
  }

  .conn-transfers {
    font-size: 12px;
    color: var(--text-muted);
  }

  .conn-transfers span { color: var(--text-secondary); }

  .conn-arrive {
    text-align: center;
  }

  .conn-arrive .conn-time {
    color: var(--text-primary);
    text-shadow: none;
    font-size: 20px;
  }

  .conn-duration {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* — Expanded connection details — */
  .conn-detail {
    grid-column: 1 / -1;
    margin: 12px -18px -16px;
    padding: 14px 18px;
    border-top: 1px solid var(--flap-border);
    background: var(--board-surface);
    display: none;
    animation: detail-in 0.25s ease-out both;
  }
  .conn.open .conn-detail { display: block; }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .leg {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 12px;
    padding: 6px 0;
    align-items: start;
  }
  .leg + .leg { border-top: 1px dashed var(--flap-border); }
  .leg-times {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    text-align: right;
  }
  .leg-times .lt-arr { color: var(--text-muted); }
  .leg-body { font-size: 13px; color: var(--text-primary); }
  .leg-body .lb-from, .leg-body .lb-to {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-primary);
  }
  .leg-body .lb-arrow { color: var(--text-muted); margin: 0 6px; }
  .leg-body .lb-line {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--board-bg);
    border: 1px solid var(--flap-border);
    color: var(--text-secondary);
  }
  .leg-body .lb-pf { color: var(--text-muted); font-size: 11px; margin-left: 6px; }
  .leg-body .lb-dir { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .leg.transfer {
    color: var(--text-muted);
    font-size: 11px;
    font-style: italic;
    grid-template-columns: 1fr;
    text-align: center;
    padding: 4px 0;
  }
  .leg.walk .leg-body { color: var(--text-secondary); font-style: italic; }

  /* — Earlier / Later pagination — */
  .pager {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
  }
  .pager button {
    flex: 1;
    background: var(--flap-bg);
    border: 1px solid var(--flap-border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .pager button:hover { color: var(--amber); border-color: var(--amber-dim); }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager button:disabled:hover { color: var(--text-secondary); border-color: var(--flap-border); }

  /* — States — */
  .state-msg {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .state-msg.loading::after {
    content: '';
    display: block;
    width: 28px;
    height: 28px;
    margin: 16px auto 0;
    border: 2px solid var(--flap-border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .state-msg.error { color: var(--red); }

  /* — Footer — */
  .footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--flap-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
  }

  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
  }

  .footer a:hover { color: var(--amber); }

  .refresh-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* — Responsive — */
  @media (max-width: 560px) {
    .header-clock { display: none; }
    .route-bar {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto auto auto;
    }
    .route-bar .station-input.from { grid-column: 1; grid-row: 1; }
    .route-bar .swap-btn            { grid-column: 2; grid-row: 1 / span 2; width: 42px; }
    .route-bar .station-input.to    { grid-column: 1; grid-row: 2; }
    .route-bar .station-input.via   { grid-column: 1 / span 2; grid-row: 3; }
    .route-bar .btn-search          { grid-column: 1 / span 2; grid-row: 4; padding: 14px; }
    .when-bar {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
    }
    .when-toggle { grid-column: 1 / span 2; }
    .when-now    { grid-column: 1 / span 2; padding: 10px; }
    .conn { grid-template-columns: 72px 1fr 72px; padding: 12px 14px; gap: 10px; }
    .conn-time { font-size: 18px; }
    .conn-arrive .conn-time { font-size: 16px; }
    .conn-detail { margin: 12px -14px -12px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="widget">
  <div class="header">
    <div class="header-icon">SBB</div>
    <div class="header-text">
      <h1>Trailhead Departures</h1>
      <p>Live connections via transport.opendata.ch</p>
    </div>
    <div class="header-clock" id="clock">--:--</div>
  </div>

  <div class="route-bar">
    <div class="station-input from" data-field="from">
      <label>From</label>
      <input type="text" id="from" value="Zürich HB" autocomplete="off" spellcheck="false">
      <button type="button" class="clear-x" aria-label="Clear">×</button>
      <div class="suggest" role="listbox"></div>
    </div>
    <button type="button" class="swap-btn" id="swap" title="Swap From and To" aria-label="Swap from and to">⇅</button>
    <div class="station-input to" data-field="to">
      <label>To</label>
      <input type="text" id="to" value="Glarus" autocomplete="off" spellcheck="false">
      <button type="button" class="clear-x" aria-label="Clear">×</button>
      <div class="suggest" role="listbox"></div>
    </div>
    <button class="btn-search" id="search">Search</button>
    <div class="station-input via" data-field="via">
      <label>Via (optional)</label>
      <input type="text" id="via" value="" autocomplete="off" spellcheck="false">
      <button type="button" class="clear-x" aria-label="Clear">×</button>
      <div class="suggest" role="listbox"></div>
    </div>
  </div>

  <div class="when-bar">
    <div class="when-toggle" role="tablist" aria-label="Time reference">
      <button type="button" id="mode-dep" aria-pressed="true">Depart at</button>
      <button type="button" id="mode-arr" aria-pressed="false">Arrive by</button>
    </div>
    <input type="date" id="date" aria-label="Date">
    <input type="time" id="time" aria-label="Time">
    <button type="button" class="when-now" id="now-btn">Now</button>
  </div>

  <div class="connections" id="connections">
    <div class="state-msg">Enter a destination and press Search</div>
  </div>

  <div class="pager" id="pager" hidden>
    <button type="button" id="earlier">← Earlier</button>
    <button type="button" id="later">Later →</button>
  </div>

  <div class="footer">
    <span><span class="refresh-dot"></span>Auto-refreshes every 60 s</span>
    <a href="https://transport.opendata.ch" target="_blank">transport.opendata.ch</a>
  </div>
</div>

<script>
const API = 'https://transport.opendata.ch/v1';

const $from   = document.getElementById('from');
const $to     = document.getElementById('to');
const $via    = document.getElementById('via');
const $btn    = document.getElementById('search');
const $swap   = document.getElementById('swap');
const $conn   = document.getElementById('connections');
const $clock  = document.getElementById('clock');
const $date   = document.getElementById('date');
const $time   = document.getElementById('time');
const $modeDep = document.getElementById('mode-dep');
const $modeArr = document.getElementById('mode-arr');
const $nowBtn  = document.getElementById('now-btn');
const $pager   = document.getElementById('pager');
const $earlier = document.getElementById('earlier');
const $later   = document.getElementById('later');

let refreshTimer = null;
let arriveBy = false;        // false = depart-at, true = arrive-by
let lastConnections = [];

// ——— Clock ———
function updateClock() {
  const now = new Date();
  $clock.textContent = now.toLocaleTimeString('de-CH', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich'
  });
}
setInterval(updateClock, 1000);
updateClock();

// ——— Time helpers ———
function swissParts(d) {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/Zurich',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d).reduce((o, p) => (o[p.type] = p.value, o), {});
}
function setNow() {
  const p = swissParts(new Date());
  $date.value = `${p.year}-${p.month}-${p.day}`;
  $time.value = `${p.hour}:${p.minute}`;
}
function fmtTime(iso) {
  if (!iso) return '--:--';
  return new Date(iso).toLocaleTimeString('de-CH', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich'
  });
}
function fmtDuration(dur) {
  if (!dur) return '';
  const m = dur.match(/(\d+)d(\d+):(\d+):/);
  if (!m) return dur;
  const days = parseInt(m[1]);
  const hrs = parseInt(m[2]) + days * 24;
  const mins = parseInt(m[3]);
  if (hrs > 0) return hrs + 'h ' + (mins ? mins + 'm' : '');
  return mins + ' min';
}
function fmtTransferWait(prevArrISO, nextDepISO) {
  if (!prevArrISO || !nextDepISO) return '';
  const wait = Math.round((new Date(nextDepISO) - new Date(prevArrISO)) / 60000);
  if (wait <= 0) return '';
  return wait + " min wait";
}

// ——— Transport classification ———
const TRANSPORT = {
  train: { icon: '🚆', match: ['IC', 'IR', 'ICE', 'EC', 'RE', 'S', 'TGV', 'RJ', 'PE', 'EXT'] },
  bus:   { icon: '🚌', match: ['B', 'BUS', 'NFB', 'KB'] },
  ship:  { icon: '⛴',  match: ['BAT', 'FAE'] },
  tram:  { icon: '🚊', match: ['T', 'TRAM', 'NFT'] },
  cable: { icon: '🚡', match: ['GB', 'PB', 'FUN', 'SL', 'LB'] },
};
function classifyCategory(cat) {
  if (!cat) return { type: '', icon: '' };
  const c = String(cat).toUpperCase();
  for (const key in TRANSPORT) {
    if (TRANSPORT[key].match.some(t => c === t || c.startsWith(t))) {
      return { type: key, icon: TRANSPORT[key].icon };
    }
  }
  return { type: '', icon: '' };
}
function legLabel(journey) {
  const cat = (journey.category || '').trim();
  const num = (journey.number || '').trim();
  if (cat && num) return cat + ' ' + num;
  if (cat) return cat;
  if (journey.name) {
    const clean = journey.name.trim();
    if (!/^\d{5,}$/.test(clean)) return clean;
  }
  return 'Train';
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ——— Render ———
function renderConnections(data) {
  lastConnections = data.connections || [];
  if (!lastConnections.length) {
    $conn.innerHTML = '<div class="state-msg">No connections found</div>';
    $pager.hidden = true;
    return;
  }
  $pager.hidden = false;

  $conn.innerHTML = lastConnections.map(function(c, idx) {
    const depTime = fmtTime(c.from && c.from.departure);
    const arrTime = fmtTime(c.to && c.to.arrival);
    const platform = c.from && c.from.platform ? 'Pl. ' + c.from.platform : '';
    const delay = c.from && c.from.delay > 0 ? "+" + c.from.delay + "'" : '';
    const isDelayed = c.from && c.from.delay > 0;
    const duration = fmtDuration(c.duration);

    const sections = c.sections || [];
    const journeySections = sections.filter(s => s.journey);
    const legBadges = sections.map(s => {
      if (s.journey) {
        const info = classifyCategory(s.journey.category);
        const label = legLabel(s.journey);
        const icon = info.icon ? info.icon + ' ' : '';
        return '<span class="conn-badge ' + info.type + '">' + icon + escHtml(label) + '</span>';
      }
      if (s.walk) return '<span class="conn-badge walk">🚶 Walk</span>';
      return '';
    }).filter(Boolean);

    const transfers = journeySections.length;
    const transferText = transfers <= 1 ? 'Direct' :
      (transfers - 1) + ' transfer' + (transfers > 2 ? 's' : '');

    return '<div class="conn' + (isDelayed ? ' delayed' : '') + '" data-idx="' + idx + '">' +
      '<span class="conn-chevron">▶</span>' +
      '<div class="conn-depart">' +
        '<div class="conn-time">' + depTime + '</div>' +
        (platform ? '<div class="conn-platform">' + escHtml(platform) + '</div>' : '') +
        (delay ? '<div class="conn-delay">' + delay + '</div>' : '') +
      '</div>' +
      '<div class="conn-middle">' +
        '<div class="conn-route">' + legBadges.join('<span class="conn-arrow">▸</span>') + '</div>' +
        '<div class="conn-transfers"><span>' + transferText + '</span></div>' +
      '</div>' +
      '<div class="conn-arrive">' +
        '<div class="conn-time">' + arrTime + '</div>' +
        '<div class="conn-duration">' + duration + '</div>' +
      '</div>' +
      renderDetail(c) +
    '</div>';
  }).join('');
}

function renderDetail(c) {
  const sections = c.sections || [];
  const parts = [];
  let prevArr = null;
  sections.forEach(function(s, i) {
    if (s.walk) {
      const mins = s.walk.duration ? Math.round(s.walk.duration / 60) : null;
      const txt = mins ? ('Walk · ' + mins + ' min') : 'Walk';
      parts.push(
        '<div class="leg walk">' +
          '<div class="leg-times"></div>' +
          '<div class="leg-body">🚶 ' + escHtml(txt) + '</div>' +
        '</div>'
      );
      return;
    }
    if (!s.journey) return;

    const dep = s.departure || {};
    const arr = s.arrival || {};
    const wait = fmtTransferWait(prevArr, dep.departure);
    if (wait) {
      parts.push('<div class="leg transfer">↪ ' + escHtml(wait) + ' at ' + escHtml((s.departure && s.departure.station && s.departure.station.name) || '') + '</div>');
    }

    const info = classifyCategory(s.journey.category);
    const line = legLabel(s.journey);
    const direction = s.journey.to ? 'towards ' + s.journey.to : '';
    const depPf = dep.platform ? '<span class="lb-pf">Pl. ' + escHtml(dep.platform) + '</span>' : '';
    const arrPf = arr.platform ? '<span class="lb-pf">Pl. ' + escHtml(arr.platform) + '</span>' : '';

    parts.push(
      '<div class="leg">' +
        '<div class="leg-times">' +
          '<div class="lt-dep">' + fmtTime(dep.departure) + '</div>' +
          '<div class="lt-arr">' + fmtTime(arr.arrival) + '</div>' +
        '</div>' +
        '<div class="leg-body">' +
          '<div>' +
            '<span class="lb-from">' + escHtml((dep.station && dep.station.name) || '') + '</span>' + depPf +
          '</div>' +
          '<div>' +
            '<span class="lb-arrow">↓</span>' +
            '<span class="lb-line ' + info.type + '">' + (info.icon ? info.icon + ' ' : '') + escHtml(line) + '</span>' +
            (direction ? '<span class="lb-dir"> · ' + escHtml(direction) + '</span>' : '') +
          '</div>' +
          '<div>' +
            '<span class="lb-to">' + escHtml((arr.station && arr.station.name) || '') + '</span>' + arrPf +
          '</div>' +
        '</div>' +
      '</div>'
    );
    prevArr = arr.arrival;
  });
  return '<div class="conn-detail">' + parts.join('') + '</div>';
}

// Expand/collapse rows
$conn.addEventListener('click', function(e) {
  const row = e.target.closest('.conn');
  if (!row) return;
  row.classList.toggle('open');
});

// ——— API call ———
function fetchConnections(opts) {
  opts = opts || {};
  const from = $from.value.trim();
  const to   = $to.value.trim();
  const via  = $via.value.trim();
  if (!from || !to) return;

  $conn.innerHTML = '<div class="state-msg loading">Loading connections…</div>';
  $pager.hidden = true;

  const params = ['from=' + encodeURIComponent(from), 'to=' + encodeURIComponent(to), 'limit=6'];
  if (via) params.push('via[]=' + encodeURIComponent(via));
  const date = opts.date || $date.value;
  const time = opts.time || $time.value;
  if (date) params.push('date=' + encodeURIComponent(date));
  if (time) params.push('time=' + encodeURIComponent(time));
  if (arriveBy) params.push('isArrivalTime=1');

  const url = API + '/connections?' + params.join('&');

  const xhr = new XMLHttpRequest();
  xhr.open('GET', url);
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      try { renderConnections(JSON.parse(xhr.responseText)); }
      catch (e) { $conn.innerHTML = '<div class="state-msg error">Bad response</div>'; }
    } else {
      $conn.innerHTML = '<div class="state-msg error">API returned ' + xhr.status + '</div>';
    }
  };
  xhr.onerror = function() {
    $conn.innerHTML = '<div class="state-msg error">Network error — check your connection</div>';
  };
  xhr.send();

  clearInterval(refreshTimer);
  refreshTimer = setInterval(function() { fetchConnections(); }, 60000);
}

// ——— Earlier / Later pagination ———
function shiftSearchTime(deltaMin) {
  if (!lastConnections.length) return;
  const anchor = deltaMin < 0
    ? lastConnections[0].from && lastConnections[0].from.departure
    : lastConnections[lastConnections.length - 1].from && lastConnections[lastConnections.length - 1].from.departure;
  if (!anchor) return;
  const t = new Date(new Date(anchor).getTime() + deltaMin * 60000);
  const p = swissParts(t);
  $date.value = `${p.year}-${p.month}-${p.day}`;
  $time.value = `${p.hour}:${p.minute}`;
  // Earlier/Later always reads as "depart at" for predictable shifting
  arriveBy = false;
  syncModeButtons();
  fetchConnections();
}
$earlier.addEventListener('click', () => shiftSearchTime(-30));
$later.addEventListener('click',   () => shiftSearchTime(+1));

// ——— Mode toggle (depart / arrive) ———
function syncModeButtons() {
  $modeDep.setAttribute('aria-pressed', arriveBy ? 'false' : 'true');
  $modeArr.setAttribute('aria-pressed', arriveBy ? 'true' : 'false');
}
$modeDep.addEventListener('click', () => { if (arriveBy) { arriveBy = false; syncModeButtons(); fetchConnections(); } });
$modeArr.addEventListener('click', () => { if (!arriveBy) { arriveBy = true;  syncModeButtons(); fetchConnections(); } });
$nowBtn.addEventListener('click', () => {
  setNow();
  arriveBy = false;
  syncModeButtons();
  fetchConnections();
});

// ——— Swap From↔To ———
$swap.addEventListener('click', () => {
  const a = $from.value; $from.value = $to.value; $to.value = a;
  syncClearVisibility($from); syncClearVisibility($to);
  fetchConnections();
});

// ——— Search button + Enter ———
$btn.addEventListener('click', () => fetchConnections());
[$from, $to, $via, $date, $time].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { closeAllSuggest(); fetchConnections(); } });
});

// ——— Station autocomplete ———
// transport.opendata.ch /locations?query=… returns ranked station matches.
// Debounce per-input; abort in-flight on each keystroke.
const SUGGEST_DEBOUNCE_MS = 180;
const STATION_KIND_LABEL = { station: 'STATION', poi: 'POI', address: 'ADDRESS' };

document.querySelectorAll('.station-input').forEach(wrap => {
  const input = wrap.querySelector('input');
  const drop  = wrap.querySelector('.suggest');
  const clear = wrap.querySelector('.clear-x');
  let debounce = null;
  let xhr = null;
  let active = -1;

  function setActive(i) {
    const items = drop.querySelectorAll('.suggest-item');
    items.forEach((el, idx) => el.classList.toggle('active', idx === i));
    active = i;
  }

  function close() {
    drop.removeAttribute('data-open');
    drop.innerHTML = '';
    active = -1;
  }

  function pick(name) {
    input.value = name;
    syncClearVisibility(input);
    close();
    input.focus();
  }

  input.addEventListener('input', () => {
    syncClearVisibility(input);
    const q = input.value.trim();
    clearTimeout(debounce);
    if (xhr) { xhr.abort(); xhr = null; }
    if (q.length < 2) { close(); return; }

    debounce = setTimeout(() => {
      xhr = new XMLHttpRequest();
      xhr.open('GET', API + '/locations?query=' + encodeURIComponent(q));
      xhr.onload = function() {
        if (xhr.status < 200 || xhr.status >= 300) { close(); return; }
        let data;
        try { data = JSON.parse(xhr.responseText); } catch (e) { close(); return; }
        const items = (data.stations || []).filter(s => s && s.name).slice(0, 8);
        if (!items.length) {
          drop.innerHTML = '<div class="suggest-empty">No matches</div>';
        } else {
          drop.innerHTML = items.map((s, i) => {
            const kind = STATION_KIND_LABEL[s.icon] || (s.id ? 'STATION' : '');
            return '<div class="suggest-item" role="option" data-name="' + escHtml(s.name) + '" data-i="' + i + '">' +
              '<span>' + escHtml(s.name) + '</span>' +
              (kind ? '<span class="sx-kind">' + kind + '</span>' : '') +
            '</div>';
          }).join('');
        }
        drop.setAttribute('data-open', '1');
        active = -1;
      };
      xhr.onerror = function() { close(); };
      xhr.send();
    }, SUGGEST_DEBOUNCE_MS);
  });

  input.addEventListener('keydown', e => {
    if (!drop.hasAttribute('data-open')) return;
    const items = drop.querySelectorAll('.suggest-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive((active + 1) % items.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((active - 1 + items.length) % items.length); }
    else if (e.key === 'Enter') {
      if (active >= 0) { e.preventDefault(); pick(items[active].dataset.name); }
    } else if (e.key === 'Escape') { close(); }
  });

  drop.addEventListener('mousedown', e => {
    const it = e.target.closest('.suggest-item');
    if (it) { e.preventDefault(); pick(it.dataset.name); }
  });

  input.addEventListener('blur', () => setTimeout(close, 120));
  clear.addEventListener('click', e => {
    e.preventDefault();
    input.value = '';
    syncClearVisibility(input);
    close();
    input.focus();
  });

  syncClearVisibility(input);
});

function syncClearVisibility(input) {
  input.closest('.station-input').classList.toggle('has-value', !!input.value.trim());
}
function closeAllSuggest() {
  document.querySelectorAll('.suggest[data-open="1"]').forEach(d => {
    d.removeAttribute('data-open');
    d.innerHTML = '';
  });
}

// ——— Init ———
setNow();
syncModeButtons();
fetchConnections();
</script>

</html>
