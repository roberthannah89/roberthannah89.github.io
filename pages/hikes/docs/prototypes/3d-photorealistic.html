<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zindlenspitz — 3D photorealistic (Google Map Tiles + Cesium)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="proto-title" content="3D Photorealistic Tiles (Google + Cesium)">
  <meta name="proto-icon" content="&#x26F0;&#xFE0F;">
  <meta name="proto-desc" content="Photogrammetric 3D mesh of the Alps via Google Map Tiles rendered with CesiumJS. GPX track + trailhead/summit pins draped on the mesh. Needs a Google Maps Platform API key (Map Tiles API enabled).">
  <meta name="proto-source" content="Google Maps Platform — Map Tiles API + CesiumJS">
  <meta name="proto-order" content="150">
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root { --pad: 14px; --fg: #1a1a1a; --muted: #6b6b6b; --bg: #f6f6f4; --accent: #c0392b; --border: #e2e2dd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { display: none; }  /* minimal UI — map is full-screen */

    /* Mode toggle — floating overlay, top-right of the map */
    .modebar {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      display: flex; gap: 0; align-items: stretch;
      background: rgba(255,255,255,0.94);
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      overflow: hidden;
      font-size: 12px;
    }
    .mode-btn {
      padding: 6px 10px;
      background: transparent; color: var(--muted); border: 0;
      font: inherit; font-size: 12px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn.active {
      background: var(--accent); color: #fff;
    }
    .mode-btn:hover:not(.active) { background: #fafaf6; color: var(--fg); }

    /* Key bar */
    .keybar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; background: #fff8e1; border-bottom: 1px solid #f0dfa0;
      font-size: 13px;
    }
    .keybar.has-key { background: #f1f8f1; border-color: #c8e0c8; }
    .keybar label { font-weight: 500; }
    .keybar input {
      flex: 1; padding: 5px 8px; font: inherit; font-size: 13px;
      border: 1px solid #ccc; border-radius: 4px; max-width: 480px;
    }
    .keybar button {
      padding: 5px 14px; font: inherit; font-size: 13px;
      background: var(--accent); color: #fff; border: 0; border-radius: 4px; cursor: pointer;
    }
    .keybar button.secondary { background: #888; }
    .keybar small { color: var(--muted); }

    /* Map pane — full viewport */
    .pane {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    .pane-cost {
      position: absolute; top: 10px; left: 12px;
      z-index: 5;
      background: rgba(255,255,255,0.82);
      padding: 3px 8px; border-radius: 4px;
      font-size: 10.5px; color: var(--muted);
      pointer-events: none;
      max-width: 320px;
    }
    .pane-cost em { font-style: normal; font-weight: 600; }
    #map-host, #cesium-container, #maplibre-map { width: 100%; height: 100%; }
    .pane-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fdfcf6; color: var(--muted); text-align: center;
      padding: 24px;
      font-size: 14px;
    }
    .pane-placeholder strong { color: var(--fg); }
    .pane-placeholder small { font-size: 12px; margin-top: 14px; line-height: 1.5; max-width: 320px; }
    .pane-placeholder small code { background: #efeee8; padding: 1px 4px; border-radius: 3px; }
    .pane-error {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(253, 245, 245, 0.97);
      color: #842;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; font-size: 13px;
      z-index: 6;
    }
    .pane-error strong { color: #b00; font-size: 14px; }
    .pane-error pre { font-size: 11.5px; background: #fff; padding: 8px 10px; border-radius: 4px; border: 1px solid #eaccca; max-width: 90%; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="keybar" id="keybar" hidden>
    <label for="gkey">Google Maps Platform API key (Map Tiles enabled):</label>
    <input id="gkey" type="password" autocomplete="off" placeholder="AIzaSy…">
    <button id="load-btn">Load</button>
    <button id="clear-btn" class="secondary" hidden>Clear</button>
    <small>Stored in <code>localStorage</code> (per-browser).</small>
  </div>

  <div class="pane">
    <div class="modebar">
      <button class="mode-btn" id="mode-cesium" data-mode="cesium">🛰 Photorealistic</button>
      <button class="mode-btn" id="mode-maplibre" data-mode="maplibre">🗺 Satellite</button>
    </div>
    <div id="map-host"><div class="pane-placeholder" id="placeholder">
      <strong>Paste an API key to load the 3D mesh.</strong>
      <small>Get one at <code>console.cloud.google.com</code> → enable <strong>Map Tiles API</strong>. Free tier: <strong>1,000 sessions</strong>/mo. Beyond: $6/1k.</small>
    </div></div>
  </div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../../routes/zindlenspitz/zindlenspitz.track.js"></script>
  <!-- Optional: same local-config.js the transit widget already consumes. CI injects this from
       the GOOGLE_MAPS_EMBED_KEY secret on deploy. Locally, copy local-config.example.js → local-config.js.
       The onerror swallow keeps things working when the file isn't present. -->
  <script src="../../local-config.js" onerror="void 0"></script>
  <script>
    const TRAILHEAD = [8.9303, 47.0851];
    const SUMMIT    = [8.95987, 47.07627];
    const CENTER    = [(TRAILHEAD[0] + SUMMIT[0]) / 2, (TRAILHEAD[1] + SUMMIT[1]) / 2];

    const KEY_STORAGE  = 'proto:google-tiles:key';
    const MODE_STORAGE = 'proto:3d-mode';

    const $keybar = document.getElementById('keybar');
    const $gkey   = document.getElementById('gkey');
    const $load   = document.getElementById('load-btn');
    const $clear  = document.getElementById('clear-btn');
    const $host   = document.getElementById('map-host');
    const $modeCesium   = document.getElementById('mode-cesium');
    const $modeMaplibre = document.getElementById('mode-maplibre');

    let cesiumViewer = null;
    let mlMap = null;
    let apiKey = '';
    let currentMode = 'cesium';

    // ===== UI helpers =====
    function showPlaceholder() {
      $host.innerHTML =
        '<div class="pane-placeholder">' +
        '<strong>Paste an API key above to load the 3D mesh.</strong>' +
        '<small>Get one at <code>console.cloud.google.com</code> → enable <strong>Map Tiles API</strong> → create a Maps Platform key. ' +
        'Free tier covers <strong>1,000 sessions</strong> / month. Beyond that it&rsquo;s $6 per additional 1,000.</small>' +
        '</div>';
    }
    function showError(title, body) {
      const safe = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      $host.innerHTML =
        '<div id="cesium-container"></div>' +
        '<div class="pane-error"><strong>' + safe(title) + '</strong>' +
        '<pre>' + safe(body) + '</pre>' +
        '<small>Common causes: Map Tiles API not enabled on the project; HTTP referrer restriction; billing not enabled.</small>' +
        '</div>';
    }
    function teardown() {
      if (cesiumViewer) { try { cesiumViewer.destroy(); } catch (e) {} cesiumViewer = null; }
      if (mlMap)        { try { mlMap.remove();         } catch (e) {} mlMap = null; }
      $host.innerHTML = '';
    }
    function updateModeUI() {
      $modeCesium.classList.toggle('active',   currentMode === 'cesium');
      $modeMaplibre.classList.toggle('active', currentMode === 'maplibre');
      // Keybar is only relevant in Cesium mode AND only when there's no key yet.
      // Once a key is loaded (auto or pasted), get out of the way and show the map.
      $keybar.hidden = (currentMode !== 'cesium') || !!apiKey;
    }

    // ===== Cesium engine =====
    async function loadCesium() {
      if (!apiKey) { showPlaceholder(); return; }
      $host.innerHTML = '<div id="cesium-container"></div>';
      try {
        cesiumViewer = new Cesium.Viewer('cesium-container', {
          baseLayer: false, baseLayerPicker: false,
          timeline: false, animation: false, geocoder: false,
          sceneModePicker: false, navigationHelpButton: false,
          homeButton: false, infoBox: false, selectionIndicator: false,
          globe: false
        });
        cesiumViewer.scene.skyAtmosphere.show = true;

        // ===== Quality: native pixel density on HiDPI displays, capped at ~4K. =====
        // useBrowserRecommendedResolution=false → Cesium multiplies the backing buffer
        // by devicePixelRatio. On a 5K Retina (innerWidth 2560 × dpr 2 = 5120-wide
        // canvas, ~14 M px/frame), that's 7× the GPU work of a 1080p monitor — way
        // past the point of visible diminishing returns. Cap effective render width
        // at ~4K; above that the resolutionScale brings it down.
        cesiumViewer.useBrowserRecommendedResolution = false;
        const dpr = window.devicePixelRatio || 1;
        const targetMaxWidth = 3840;  // 4K UHD width
        const fullWidth = window.innerWidth * dpr;
        if (fullWidth > targetMaxWidth) {
          cesiumViewer.resolutionScale = targetMaxWidth / fullWidth;
        }
        // FXAA is cheap and helps ridge edges; always on.
        if (cesiumViewer.scene.postProcessStages && cesiumViewer.scene.postProcessStages.fxaa) {
          cesiumViewer.scene.postProcessStages.fxaa.enabled = true;
        }

        const tileset = await Cesium.createGooglePhotorealistic3DTileset(apiKey);
        // Tile density: default screen-space error is 16. Halving it to 8 loads ~4×
        // more tiles — sharp on desktop, brutal on cellular. Apply only on big screens
        // with non-cellular connection signal.
        const isPhoneClass = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                             window.matchMedia('(max-width: 900px)').matches;
        if (!isPhoneClass) {
          tileset.maximumScreenSpaceError = 8;
        }
        cesiumViewer.scene.primitives.add(tileset);

        const coords = (window.TRACK || []).flatMap(p => [p[1], p[0]]);
        if (coords.length) {
          cesiumViewer.entities.add({
            name: 'GPX Track',
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray(coords),
              width: 4,
              material: new Cesium.PolylineOutlineMaterialProperty({
                color: Cesium.Color.fromCssColorString('#e74c3c'),
                outlineWidth: 1.5,
                outlineColor: Cesium.Color.BLACK.withAlpha(0.6)
              }),
              clampToGround: true
            }
          });
        }
        cesiumViewer.entities.add({
          name: 'Trailhead',
          position: Cesium.Cartesian3.fromDegrees(TRAILHEAD[0], TRAILHEAD[1]),
          point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#27ae60'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
          label: { text: 'Trailhead', font: '12px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -18), fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Number.POSITIVE_INFINITY }
        });
        cesiumViewer.entities.add({
          name: 'Zindlenspitz',
          position: Cesium.Cartesian3.fromDegrees(SUMMIT[0], SUMMIT[1]),
          point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#c0392b'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
          label: { text: 'Zindlenspitz 2111 m', font: '12px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -18), fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Number.POSITIVE_INFINITY }
        });

        // Frame the whole hike: compute a bounding sphere across the track +
        // trailhead + summit, then fly to it with a low-oblique look. range =
        // 2.5× sphere radius pulls the camera back so the entire track fits
        // with comfortable margin around it.
        const framingPoints = [
          ...((window.TRACK || []).map(p => Cesium.Cartesian3.fromDegrees(p[1], p[0]))),
          Cesium.Cartesian3.fromDegrees(TRAILHEAD[0], TRAILHEAD[1]),
          Cesium.Cartesian3.fromDegrees(SUMMIT[0], SUMMIT[1])
        ];
        const sphere = Cesium.BoundingSphere.fromPoints(framingPoints);
        cesiumViewer.camera.flyToBoundingSphere(sphere, {
          duration: 0,
          offset: new Cesium.HeadingPitchRange(
            Cesium.Math.toRadians(35),
            Cesium.Math.toRadians(-40),
            Math.max(sphere.radius * 2.5, 2500)
          )
        });
        $keybar.classList.add('has-key');
        $clear.hidden = false;
        $load.textContent = 'Reload';
      } catch (err) {
        showError('Could not load Google Photorealistic 3D Tiles', err && err.message ? err.message : String(err));
      }
    }

    // ===== MapLibre engine =====
    function loadMapLibre() {
      $host.innerHTML = '<div id="maplibre-map"></div>';
      mlMap = new maplibregl.Map({
        container: 'maplibre-map',
        style: {
          version: 8,
          sources: {
            swissimage: {
              type: 'raster',
              tiles: ['https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg'],
              tileSize: 256, maxzoom: 19, attribution: '© swisstopo'
            },
            terrarium: {
              type: 'raster-dem',
              tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
              tileSize: 256, maxzoom: 15, encoding: 'terrarium',
              attribution: 'Terrain: Mapzen / AWS Open Data'
            }
          },
          layers: [{ id: 'satellite', type: 'raster', source: 'swissimage' }],
          terrain: { source: 'terrarium', exaggeration: 1.5 },
          sky: { 'sky-color': '#9fc8ec', 'horizon-color': '#dfe7ed', 'fog-color': '#dfe7ed', 'fog-ground-blend': 0.5 }
        },
        center: CENTER, zoom: 13, pitch: 70, bearing: 35, maxPitch: 85
      });
      mlMap.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
      mlMap.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-right');
      mlMap.on('load', () => {
        const coords = (window.TRACK || []).map(p => [p[1], p[0]]);
        if (coords.length) {
          mlMap.addSource('track', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } } });
          mlMap.addLayer({ id: 'track-casing', type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#1a1a1a', 'line-width': 6, 'line-opacity': 0.45 } });
          mlMap.addLayer({ id: 'track-line',   type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#e74c3c', 'line-width': 3.5 } });
        }
        new maplibregl.Marker({ color: '#27ae60' }).setLngLat(TRAILHEAD).setPopup(new maplibregl.Popup().setText('Trailhead — Wägitalersee P. 932')).addTo(mlMap);
        new maplibregl.Marker({ color: '#c0392b' }).setLngLat(SUMMIT).setPopup(new maplibregl.Popup().setText('Zindlenspitz — 2111 m')).addTo(mlMap);

        // Auto-frame to the whole track + endpoints. 80px padding leaves margin
        // around the bounds; pitch/bearing preserved so the oblique 3D look stays.
        if (coords.length) {
          const b = coords.reduce((acc, c) => acc.extend(c),
            new maplibregl.LngLatBounds(coords[0], coords[0]));
          b.extend(TRAILHEAD); b.extend(SUMMIT);
          mlMap.fitBounds(b, { padding: 80, duration: 0, pitch: 70, bearing: 35 });
        }
      });
    }

    // ===== Mode switching =====
    function applyMode(mode) {
      currentMode = mode;
      try { localStorage.setItem(MODE_STORAGE, mode); } catch (e) {}
      teardown();
      updateModeUI();
      if (mode === 'cesium') loadCesium();
      else                   loadMapLibre();
    }

    $modeCesium.addEventListener('click', () => applyMode('cesium'));
    $modeMaplibre.addEventListener('click', () => applyMode('maplibre'));

    // ===== Key controls =====
    function setKey(key) {
      apiKey = key;
      try { localStorage.setItem(KEY_STORAGE, key); } catch (e) {}
      updateModeUI();
      if (currentMode === 'cesium') loadCesium();
    }
    function clearKey() {
      try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
      apiKey = '';
      $gkey.value = '';
      $clear.hidden = true;
      $load.textContent = 'Load';
      updateModeUI();
      if (currentMode === 'cesium') { teardown(); showPlaceholder(); }
    }
    $load.addEventListener('click', () => {
      const k = $gkey.value.trim();
      if (!k) return;
      setKey(k);
    });
    $clear.addEventListener('click', clearKey);
    $gkey.addEventListener('keydown', (e) => { if (e.key === 'Enter') $load.click(); });

    // ===== Initial state =====
    try { currentMode = localStorage.getItem(MODE_STORAGE) || 'cesium'; } catch (e) {}

    let keySource = '';
    try {
      if (window.HIKING_CONFIG && window.HIKING_CONFIG.googleMapsApiKey) {
        apiKey = window.HIKING_CONFIG.googleMapsApiKey;
        keySource = 'config';
      } else {
        const saved = localStorage.getItem(KEY_STORAGE);
        if (saved) { apiKey = saved; keySource = 'storage'; }
      }
    } catch (e) {}
    if (apiKey) {
      $gkey.value = apiKey;
      $clear.hidden = false;
      $load.textContent = 'Reload';
      if (keySource === 'config') {
        $keybar.querySelector('small').innerHTML = 'Auto-loaded from <code>local-config.js</code>.';
      }
    }
    updateModeUI();  // Keybar stays hidden when apiKey is set; visible only when user needs to paste.
    if (currentMode === 'cesium') loadCesium();
    else                          loadMapLibre();
  </script>
</body>
</html>
