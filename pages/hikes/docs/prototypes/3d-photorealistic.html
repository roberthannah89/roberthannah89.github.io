<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D photorealistic — Google Map Tiles + Cesium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="proto-title" content="3D Photorealistic Tiles (Google + Cesium)">
  <meta name="proto-icon" content="&#x26F0;&#xFE0F;">
  <meta name="proto-desc" content="Photogrammetric 3D mesh of the Alps via Google Map Tiles rendered with CesiumJS. GPX track + start/end pins draped on the mesh. Works for any hike via ?hike=<slug>. Needs a Google Maps Platform API key (Map Tiles API enabled).">
  <meta name="proto-source" content="Google Maps Platform — Map Tiles API + CesiumJS">
  <meta name="proto-order" content="150">
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    :root { --pad: 14px; --fg: #1a1a1a; --muted: #6b6b6b; --bg: #f6f6f4; --accent: #c0392b; --border: #e2e2dd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { display: none; }  /* minimal UI — map is full-screen */

    /* Mode toggle — floating overlay, top-left of the map. Kept off top-right
       so it doesn't overlap MapLibre's NavigationControl (in Satellite mode)
       or Cesium's native navigation cluster (in Photorealistic mode). */
    .modebar {
      position: absolute; top: 12px; left: 12px; z-index: 6;
      display: flex; gap: 4px; align-items: stretch;
      font-size: 12px;
    }
    .mode-btn {
      padding: 6px 10px;
      background: rgba(0,0,0,0.35); color: rgba(255,255,255,0.85);
      border: 0; border-radius: 4px;
      font: inherit; font-size: 12px; cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn.active {
      background: var(--accent); color: #fff;
    }
    .mode-btn:hover:not(.active) { background: rgba(0,0,0,0.55); color: #fff; }

    /* (Keybar removed — key auto-loads from window.HIKING_CONFIG / local-config.js.
       To paste a key manually: localStorage.setItem('proto:google-tiles:key', 'AIzaSy…')) */

    /* Map pane — full viewport */
    .pane {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    .pane-cost {
      position: absolute; top: 10px; left: 12px;
      z-index: 5;
      background: rgba(255,255,255,0.82);
      padding: 3px 8px; border-radius: 4px;
      font-size: 10.5px; color: var(--muted);
      pointer-events: none;
      max-width: 320px;
    }
    .pane-cost em { font-style: normal; font-weight: 600; }

    /* Quality toggle — bottom-right of the map (bottom-left has Cesium attribution) */
    .quality-btn {
      position: absolute; bottom: 12px; right: 12px; z-index: 6;
      background: rgba(255,255,255,0.94);
      border: 0; border-radius: 14px;
      padding: 5px 12px;
      font: inherit; font-size: 11.5px; font-weight: 500;
      color: var(--fg); cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .quality-btn:hover { background: #fff; }

    /* Cesium's bottom credits strip renders on an opaque white background by
       default — make it transparent so the mesh shows through underneath the
       small "CESIUM ion · Google Maps" attribution. */
    .cesium-viewer-bottom, .cesium-widget-credits {
      background: transparent !important;
    }
    .cesium-widget-credits, .cesium-widget-credits * {
      color: rgba(255,255,255,0.85) !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Controls hint — bottom-center, auto-fades after first interaction. */
    .controls-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      background: rgba(0,0,0,0.55); color: #fff;
      padding: 5px 12px; border-radius: 12px;
      font-size: 11px; letter-spacing: .01em;
      pointer-events: none;
      transition: opacity .4s ease;
    }
    .controls-hint.hidden { opacity: 0; }
    @media (max-width: 600px) {
      .controls-hint { font-size: 10px; padding: 4px 9px; }
    }

    #map-host, #cesium-container, #maplibre-map { width: 100%; height: 100%; }
    .pane-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #fdfcf6; color: var(--muted); text-align: center;
      padding: 24px;
      font-size: 14px;
    }
    .pane-placeholder strong { color: var(--fg); }
    /* Click-to-activate static preview (Cesium) */
    .preview-host {
      width: 100%; height: 100%; position: relative;
      background: #d8e3d0;
      cursor: pointer;
    }
    .preview-img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .preview-img.missing { display: none; }
    .preview-host.no-img {
      background: linear-gradient(135deg, #6b8e63 0%, #4a6b46 50%, #2d3f2c 100%);
    }
    .preview-activate {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      color: #fff; font-size: 18px; font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: background 0.15s;
    }
    .preview-host:hover .preview-activate { background: rgba(0,0,0,0.15); }
    .preview-activate .play-circle {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }
    .preview-host:hover .preview-activate .play-circle { transform: scale(1.06); }
    .preview-activate .play-circle::after {
      content: ''; display: block;
      width: 0; height: 0;
      border: 12px solid transparent;
      border-left: 20px solid var(--accent);
      margin-left: 5px;
    }
    .preview-activate .label { margin-top: 8px; font-size: 14px; font-weight: 500; }
    .preview-activate .label small { display: block; font-size: 11px; opacity: 0.8; font-weight: 400; margin-top: 2px; }
    .pane-placeholder small { font-size: 12px; margin-top: 14px; line-height: 1.5; max-width: 320px; }
    .pane-placeholder small code { background: #efeee8; padding: 1px 4px; border-radius: 3px; }
    .pane-error {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(253, 245, 245, 0.97);
      color: #842;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; font-size: 13px;
      z-index: 6;
    }
    .pane-error strong { color: #b00; font-size: 14px; }
    .pane-error pre { font-size: 11.5px; background: #fff; padding: 8px 10px; border-radius: 4px; border: 1px solid #eaccca; max-width: 90%; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="pane">
    <div class="modebar">
      <button class="mode-btn" id="mode-cesium" data-mode="cesium">🛰 Photorealistic</button>
      <button class="mode-btn" id="mode-maplibre" data-mode="maplibre">🗺 Satellite</button>
    </div>
    <button class="quality-btn" id="quality-btn" hidden>⚡ Fast</button>
    <div class="controls-hint" id="controls-hint" hidden>drag to look · scroll to zoom · Ctrl+drag to tilt</div>
    <div id="map-host"><div class="pane-placeholder" id="placeholder">
      <strong>Paste an API key to load the 3D mesh.</strong>
      <small>Get one at <code>console.cloud.google.com</code> → enable <strong>Map Tiles API</strong>. Free tier: <strong>1,000 sessions</strong>/mo. Beyond: $6/1k.</small>
    </div></div>
  </div>

  <!-- Cesium loader with CDN fallback chain. cesium.com is sometimes blocked
       by ad blockers or corporate proxies; unpkg / jsdelivr almost always work.
       Sets window.__cesiumReady to a Promise that resolves once Cesium is
       defined on window. loadCesiumReal() awaits it before calling any Cesium.* API. -->
  <script>
  (function () {
    var CDNS = [
      'https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js',
      'https://unpkg.com/cesium@1.122/Build/Cesium/Cesium.js',
      'https://cdn.jsdelivr.net/npm/cesium@1.122/Build/Cesium/Cesium.js'
    ];
    window.__cesiumReady = new Promise(function (resolve, reject) {
      var i = 0;
      (function tryNext() {
        if (typeof window.Cesium !== 'undefined') return resolve();
        if (i >= CDNS.length) return reject(new Error('Cesium failed to load from all CDNs (cesium.com, unpkg, jsdelivr). An ad blocker or network filter is likely blocking it.'));
        var s = document.createElement('script');
        s.src = CDNS[i++];
        s.onload = function () { typeof window.Cesium !== 'undefined' ? resolve() : tryNext(); };
        s.onerror = tryNext;
        document.head.appendChild(s);
      })();
    });
  })();
  </script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- Optional: same local-config.js the transit widget already consumes. CI injects this from
       the GOOGLE_MAPS_EMBED_KEY secret on deploy. Locally, copy local-config.example.js → local-config.js.
       The onerror swallow keeps things working when the file isn't present. -->
  <script src="../../local-config.js" onerror="void 0"></script>
  <script>
    const KEY_STORAGE     = 'proto:google-tiles:key';
    const MODE_STORAGE    = 'proto:3d-mode';
    const QUALITY_STORAGE = 'proto:3d-quality';
    const DEFAULT_HIKE    = 'zindlenspitz';

    // Read ?hike=slug from URL; sanitize to lowercase + digits/dashes only.
    const _params = new URLSearchParams(location.search);
    const hikeSlug = (_params.get('hike') || DEFAULT_HIKE)
                      .toLowerCase().replace(/[^a-z0-9-]/g, '');
    // ?activate=1 — skip the click-to-activate gate and go straight to Cesium.
    // Used by the hike-page iframe embed where the parent already gates the load
    // behind its own rainbow-button click.
    const autoActivate = _params.get('activate') === '1';
    // ?capture=1 — snapshot-friendly mode: Sharp quality, less top-down pitch
    // (-30° vs the default -50°), no chrome. Used by scripts/snapshot_3d_previews.py.
    const captureMode = _params.get('capture') === '1';

    // Resolved post-track-load from TRACK[0] and TRACK[last]. [lon, lat].
    let TRAILHEAD = [0, 0];
    let SUMMIT    = [0, 0];
    let CENTER    = [0, 0];

    const $host         = document.getElementById('map-host');
    const $modeCesium   = document.getElementById('mode-cesium');
    const $modeMaplibre = document.getElementById('mode-maplibre');
    const $qualityBtn   = document.getElementById('quality-btn');
    const $controlsHint = document.getElementById('controls-hint');

    let cesiumViewer = null;
    let cesiumTileset = null;
    let mlMap = null;
    let apiKey = '';
    let currentMode = 'cesium';
    let cesiumActivated = false;  // false until user clicks the static-preview overlay
    let savedCameraState = null;  // last camera state across mode swaps, for sync
    // Quality tiers, low → high:
    //   'eco':   no HiDPI (browser-recommended) + SSE 24 — older laptops, weak GPUs
    //   'fast':  ~4K render cap + SSE 12 — default, good on most modern hardware
    //   'sharp': native HiDPI + SSE 8 — best on a strong desktop GPU
    let currentQuality = 'fast';
    const QUALITY_ORDER = ['eco', 'fast', 'sharp'];
    const QUALITY_LABELS = { eco: '🐢 Eco', fast: '⚡ Fast', sharp: '🎨 Sharp' };
    const QUALITY_TITLES = {
      eco:   'Eco: no HiDPI render, sparse tiles. Click for Fast.',
      fast:  'Fast: ~4K render cap, balanced tiles. Click for Sharp.',
      sharp: 'Sharp: full HiDPI, dense tiles. Click for Eco.'
    };

    // ===== UI helpers =====
    function showPlaceholder() {
      $host.innerHTML =
        '<div class="pane-placeholder">' +
        '<strong>Paste an API key above to load the 3D mesh.</strong>' +
        '<small>Get one at <code>console.cloud.google.com</code> → enable <strong>Map Tiles API</strong> → create a Maps Platform key. ' +
        'Free tier covers <strong>1,000 sessions</strong> / month. Beyond that it&rsquo;s $6 per additional 1,000.</small>' +
        '</div>';
    }
    function showError(title, body) {
      const safe = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      $host.innerHTML =
        '<div id="cesium-container"></div>' +
        '<div class="pane-error"><strong>' + safe(title) + '</strong>' +
        '<pre>' + safe(body) + '</pre>' +
        '<small>Common causes: Map Tiles API not enabled on the project; HTTP referrer restriction; billing not enabled.</small>' +
        '</div>';
    }
    function teardown() {
      if (cesiumViewer) { try { cesiumViewer.destroy(); } catch (e) {} cesiumViewer = null; }
      cesiumTileset = null;
      if (mlMap)        { try { mlMap.remove();         } catch (e) {} mlMap = null; }
      $host.innerHTML = '';
    }

    // ===== Camera state shared between modes =====
    // We unify Cesium + MapLibre cameras into { lng, lat, distance, heading, pitch }
    // so toggling between them preserves the viewer's vantage point.
    function distanceToZoom(distance, lat) {
      // Convert a viewing distance (m) to a MapLibre Mercator zoom level so the
      // same area fills the same fraction of the viewport.
      const c = 40075016.686 * Math.cos(lat * Math.PI / 180);
      return Math.log2((window.innerWidth * c) / (256 * distance));
    }
    function zoomToDistance(zoom, lat) {
      const c = 40075016.686 * Math.cos(lat * Math.PI / 180);
      return (window.innerWidth * c) / (256 * Math.pow(2, zoom));
    }
    function captureCesiumCamera() {
      if (!cesiumViewer) return null;
      const cam = cesiumViewer.camera;
      const w = cesiumViewer.canvas.clientWidth  || window.innerWidth;
      const h = cesiumViewer.canvas.clientHeight || window.innerHeight;
      const center = cam.pickEllipsoid(new Cesium.Cartesian2(w / 2, h / 2));
      if (!center) return null;
      const carto = Cesium.Cartographic.fromCartesian(center);
      const distance = Cesium.Cartesian3.distance(cam.position, center);
      return {
        lng: Cesium.Math.toDegrees(carto.longitude),
        lat: Cesium.Math.toDegrees(carto.latitude),
        distance: distance,
        heading: Cesium.Math.toDegrees(cam.heading),
        pitch:   Cesium.Math.toDegrees(cam.pitch)   // negative looking down
      };
    }
    function captureMapLibreCamera() {
      if (!mlMap) return null;
      const c = mlMap.getCenter();
      return {
        lng: c.lng,
        lat: c.lat,
        distance: zoomToDistance(mlMap.getZoom(), c.lat),
        heading: mlMap.getBearing(),
        // MapLibre pitch is 0 = top-down, 60 = oblique. Cesium pitch is -90 = top-down,
        // 0 = horizon. Convert MapLibre → Cesium-like negative angle.
        pitch: -(90 - mlMap.getPitch())
      };
    }
    function applyToCesiumCamera(state) {
      if (!cesiumViewer || !state) return;
      cesiumViewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(state.lng, state.lat, 0),
        orientation: {
          heading: Cesium.Math.toRadians(state.heading || 0),
          pitch:   Cesium.Math.toRadians(state.pitch ?? -50),
          roll: 0
        }
      });
      // Pull back by `distance` along the camera's backward vector
      cesiumViewer.camera.moveBackward(state.distance || 5000);
    }
    function applyToMapLibreCamera(state) {
      if (!mlMap || !state) return;
      mlMap.jumpTo({
        center: [state.lng, state.lat],
        zoom: distanceToZoom(state.distance || 5000, state.lat),
        bearing: state.heading || 0,
        // Cesium pitch (negative, -90..0) → MapLibre (0..90)
        pitch: Math.max(0, Math.min(85, 90 + (state.pitch || -50)))
      });
    }
    function updateModeUI() {
      $modeCesium.classList.toggle('active',   currentMode === 'cesium');
      $modeMaplibre.classList.toggle('active', currentMode === 'maplibre');
      // Quality button only meaningful in Cesium mode (MapLibre has no comparable lever).
      $qualityBtn.hidden = (currentMode !== 'cesium');
      $qualityBtn.textContent = QUALITY_LABELS[currentQuality] || QUALITY_LABELS.fast;
      $qualityBtn.title = QUALITY_TITLES[currentQuality] || QUALITY_TITLES.fast;
      // Controls hint only in Cesium mode — MapLibre has its own affordances.
      $controlsHint.hidden = (currentMode !== 'cesium');
    }

    // ===== Cesium quality knobs =====
    function applyCesiumQuality() {
      if (!cesiumViewer) return;
      if (currentQuality === 'eco') {
        // No HiDPI render; let the browser upscale. Sparse tiles to spare cellular.
        cesiumViewer.useBrowserRecommendedResolution = true;
        cesiumViewer.resolutionScale = 1;
        if (cesiumTileset) cesiumTileset.maximumScreenSpaceError = 24;
      } else if (currentQuality === 'sharp') {
        cesiumViewer.useBrowserRecommendedResolution = false;
        cesiumViewer.resolutionScale = 1;  // full native HiDPI
        if (cesiumTileset) cesiumTileset.maximumScreenSpaceError = 8;
      } else {
        // 'fast' — native HiDPI but cap effective render width at 4K.
        cesiumViewer.useBrowserRecommendedResolution = false;
        const dpr = window.devicePixelRatio || 1;
        const targetMaxWidth = 3840;
        const fullWidth = window.innerWidth * dpr;
        cesiumViewer.resolutionScale = fullWidth > targetMaxWidth ? targetMaxWidth / fullWidth : 1;
        if (cesiumTileset) cesiumTileset.maximumScreenSpaceError = 12;
      }
    }
    function setQuality(quality) {
      currentQuality = quality;
      try { localStorage.setItem(QUALITY_STORAGE, quality); } catch (e) {}
      updateModeUI();
      applyCesiumQuality();
    }

    // ===== Cesium engine =====
    function showCesiumPreview() {
      // Click-to-activate gate: don't burn a Map Tiles session until the user opts in.
      // Preview image lives at routes/<slug>/photoreal-preview.jpg. If missing, the
      // <img> stays hidden via onerror and we fall back to a gradient.
      $host.innerHTML =
        '<div class="preview-host" id="preview-host">' +
          '<img class="preview-img" src="../../routes/' + hikeSlug +
            '/photoreal-preview.jpg" onerror="this.classList.add(\'missing\');' +
            'this.parentElement.classList.add(\'no-img\');">' +
          '<div class="preview-activate">' +
            '<div class="play-circle"></div>' +
            '<div class="label">Load photorealistic 3D' +
              '<small>Uses 1 Map Tiles session (3-hour token)</small>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.getElementById('preview-host').addEventListener('click', () => {
        cesiumActivated = true;
        loadCesiumReal();
      });
    }

    async function loadCesium() {
      if (!apiKey) { showPlaceholder(); return; }
      // First-time Cesium load in this session → show static preview unless the
      // user has already activated (toggling back from MapLibre, etc) or the
      // ?activate=1 URL param skips the gate (hike-page iframe embed).
      if (!cesiumActivated && !savedCameraState && !autoActivate) {
        showCesiumPreview();
        return;
      }
      cesiumActivated = true;  // so further toggles don't show the gate again
      return loadCesiumReal();
    }

    async function loadCesiumReal() {
      $host.innerHTML = '<div id="cesium-container"></div>';
      try {
        await window.__cesiumReady;
        cesiumViewer = new Cesium.Viewer('cesium-container', {
          baseLayer: false, baseLayerPicker: false,
          timeline: false, animation: false, geocoder: false,
          sceneModePicker: false, navigationHelpButton: false,
          homeButton: false, infoBox: false, selectionIndicator: false
        });
        // Hide the globe but keep it — with globe:false in the constructor Cesium
        // sets rotateEventTypes/translateEventTypes to null (no pivot to orbit
        // around), so left-drag pan and Ctrl+drag tilt silently no-op. Keeping the
        // globe present but invisible lets ScreenSpaceCameraController wire up the
        // full drag set while the photorealistic tileset renders unobscured.
        cesiumViewer.scene.globe.show = false;
        cesiumViewer.scene.globe.depthTestAgainstTerrain = false;
        cesiumViewer.scene.skyAtmosphere.show = true;

        // FXAA is cheap and helps ridge edges; always on.
        if (cesiumViewer.scene.postProcessStages && cesiumViewer.scene.postProcessStages.fxaa) {
          cesiumViewer.scene.postProcessStages.fxaa.enabled = true;
        }

        cesiumTileset = await Cesium.createGooglePhotorealistic3DTileset(apiKey);
        cesiumViewer.scene.primitives.add(cesiumTileset);
        // Expose to Playwright for scripts/snapshot_3d_previews.py (readiness
        // check + render-loop freeze + attribution hide before the screenshot).
        window.cesiumViewer = cesiumViewer;
        window.cesiumTileset = cesiumTileset;

        // Apply the user's selected quality (Fast caps at ~4K + SSE 12; Sharp = native + SSE 8)
        applyCesiumQuality();

        const coords = (window.TRACK || []).flatMap(p => [p[1], p[0]]);
        if (coords.length) {
          cesiumViewer.entities.add({
            name: 'GPX Track',
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray(coords),
              width: 4,
              material: new Cesium.PolylineOutlineMaterialProperty({
                color: Cesium.Color.fromCssColorString('#e74c3c'),
                outlineWidth: 1.5,
                outlineColor: Cesium.Color.BLACK.withAlpha(0.6)
              }),
              clampToGround: true
            }
          });
        }
        cesiumViewer.entities.add({
          name: 'Start',
          position: Cesium.Cartesian3.fromDegrees(TRAILHEAD[0], TRAILHEAD[1]),
          point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#27ae60'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
          label: { text: 'Start', font: '12px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -18), fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Number.POSITIVE_INFINITY }
        });
        cesiumViewer.entities.add({
          name: 'End',
          position: Cesium.Cartesian3.fromDegrees(SUMMIT[0], SUMMIT[1]),
          point: { pixelSize: 12, color: Cesium.Color.fromCssColorString('#c0392b'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND },
          label: { text: 'End', font: '12px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -18), fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3, style: Cesium.LabelStyle.FILL_AND_OUTLINE, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Number.POSITIVE_INFINITY }
        });

        // If toggling in from MapLibre, restore vantage point. Otherwise auto-frame
        // the whole hike: compute a bounding sphere across the track + start + end,
        // fly to it with a low-oblique look.
        if (savedCameraState) {
          applyToCesiumCamera(savedCameraState);
          savedCameraState = null;
        } else {
          const framingPoints = [
            ...((window.TRACK || []).map(p => Cesium.Cartesian3.fromDegrees(p[1], p[0]))),
            Cesium.Cartesian3.fromDegrees(TRAILHEAD[0], TRAILHEAD[1]),
            Cesium.Cartesian3.fromDegrees(SUMMIT[0], SUMMIT[1])
          ];
          const sphere = Cesium.BoundingSphere.fromPoints(framingPoints);
          // Capture mode uses a less top-down pitch (-30°) for more cinematic
          // preview thumbnails. Live view keeps the -50° default which frames
          // longer hikes better.
          cesiumViewer.camera.flyToBoundingSphere(sphere, {
            duration: 0,
            offset: new Cesium.HeadingPitchRange(
              Cesium.Math.toRadians(35),
              Cesium.Math.toRadians(captureMode ? -30 : -50),
              Math.max(sphere.radius * (captureMode ? 6 : 5), 5000)
            )
          });
        }
      } catch (err) {
        showError('Could not load Google Photorealistic 3D Tiles', err && err.message ? err.message : String(err));
      }
    }

    // ===== MapLibre engine =====
    function loadMapLibre() {
      $host.innerHTML = '<div id="maplibre-map"></div>';
      mlMap = new maplibregl.Map({
        container: 'maplibre-map',
        style: {
          version: 8,
          sources: {
            swissimage: {
              type: 'raster',
              tiles: ['https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg'],
              tileSize: 256, maxzoom: 19, attribution: '© swisstopo'
            },
            terrarium: {
              type: 'raster-dem',
              tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
              tileSize: 256, maxzoom: 15, encoding: 'terrarium',
              attribution: 'Terrain: Mapzen / AWS Open Data'
            }
          },
          layers: [{ id: 'satellite', type: 'raster', source: 'swissimage' }],
          terrain: { source: 'terrarium', exaggeration: 1.5 },
          sky: { 'sky-color': '#9fc8ec', 'horizon-color': '#dfe7ed', 'fog-color': '#dfe7ed', 'fog-ground-blend': 0.5 }
        },
        center: CENTER, zoom: 13, pitch: 70, bearing: 35, maxPitch: 85
      });
      mlMap.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
      mlMap.on('load', () => {
        const coords = (window.TRACK || []).map(p => [p[1], p[0]]);
        if (coords.length) {
          mlMap.addSource('track', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } } });
          mlMap.addLayer({ id: 'track-casing', type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#1a1a1a', 'line-width': 6, 'line-opacity': 0.45 } });
          mlMap.addLayer({ id: 'track-line',   type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#e74c3c', 'line-width': 3.5 } });
        }
        new maplibregl.Marker({ color: '#27ae60' }).setLngLat(TRAILHEAD).setPopup(new maplibregl.Popup().setText('Start')).addTo(mlMap);
        new maplibregl.Marker({ color: '#c0392b' }).setLngLat(SUMMIT).setPopup(new maplibregl.Popup().setText('End')).addTo(mlMap);

        // Auto-frame to the whole track + endpoints, unless restoring from Cesium.
        if (savedCameraState) {
          applyToMapLibreCamera(savedCameraState);
          savedCameraState = null;
        } else if (coords.length) {
          const b = coords.reduce((acc, c) => acc.extend(c),
            new maplibregl.LngLatBounds(coords[0], coords[0]));
          b.extend(TRAILHEAD); b.extend(SUMMIT);
          mlMap.fitBounds(b, { padding: 80, duration: 0, pitch: 70, bearing: 35 });
        }
      });
    }

    // ===== Mode switching =====
    function applyMode(mode) {
      // Capture the outgoing engine's vantage point so the incoming engine can
      // restore it (same lookAt, distance, heading, pitch).
      savedCameraState = currentMode === 'cesium'
        ? captureCesiumCamera()
        : captureMapLibreCamera();
      currentMode = mode;
      try { localStorage.setItem(MODE_STORAGE, mode); } catch (e) {}
      teardown();
      updateModeUI();
      if (mode === 'cesium') loadCesium();
      else                   loadMapLibre();
    }

    $modeCesium.addEventListener('click', () => applyMode('cesium'));
    $modeMaplibre.addEventListener('click', () => applyMode('maplibre'));
    $qualityBtn.addEventListener('click', () => {
      const idx = QUALITY_ORDER.indexOf(currentQuality);
      const next = QUALITY_ORDER[(idx + 1) % QUALITY_ORDER.length];
      setQuality(next);
    });
    // Fade the controls hint out after the first real interaction so it doesn't
    // clutter the map forever. Auto-dismisses after 8s if the user never touches it.
    let controlsHintDismissed = false;
    function dismissControlsHint() {
      if (controlsHintDismissed) return;
      controlsHintDismissed = true;
      $controlsHint.classList.add('hidden');
    }
    ['wheel', 'pointerdown'].forEach(evt =>
      document.addEventListener(evt, dismissControlsHint, { once: true, passive: true })
    );
    setTimeout(dismissControlsHint, 8000);

    // ===== Initial state =====
    try { currentMode = localStorage.getItem(MODE_STORAGE) || 'cesium'; } catch (e) {}
    try { currentQuality = localStorage.getItem(QUALITY_STORAGE) || 'fast'; } catch (e) {}
    if (captureMode) {
      currentMode = 'cesium';
      currentQuality = 'sharp';
    }

    // Key resolution: 1) window.HIKING_CONFIG.googleMapsApiKey (CI-injected from
    // GOOGLE_MAPS_EMBED_KEY into local-config.js, or local copy), 2) localStorage
    // override (set via DevTools: localStorage.setItem('proto:google-tiles:key', '…')).
    try {
      if (window.HIKING_CONFIG && window.HIKING_CONFIG.googleMapsApiKey) {
        apiKey = window.HIKING_CONFIG.googleMapsApiKey;
      } else {
        const saved = localStorage.getItem(KEY_STORAGE);
        if (saved) apiKey = saved;
      }
    } catch (e) {}

    // Dynamically load the requested hike's track.js, then init the engine.
    // Track files set window.TRACK = [[lat, lon, ele], ...].
    function loadTrack(slug) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = '../../routes/' + slug + '/' + slug + '.track.js';
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('No track data for hike "' + slug + '"'));
        document.head.appendChild(s);
      });
    }
    function deriveEndpoints() {
      const T = window.TRACK || [];
      if (!T.length) return false;
      const a = T[0], b = T[T.length - 1];
      TRAILHEAD = [a[1], a[0]];  // track is [lat, lon, ele] → [lon, lat]
      SUMMIT    = [b[1], b[0]];
      CENTER    = [(TRAILHEAD[0] + SUMMIT[0]) / 2, (TRAILHEAD[1] + SUMMIT[1]) / 2];
      return true;
    }

    // In capture mode, hide all overlay UI so the snapshot has just the map.
    if (captureMode) {
      $modeCesium.parentElement.style.display = 'none';
      $qualityBtn.style.display = 'none';
      $controlsHint.style.display = 'none';
    }

    updateModeUI();
    loadTrack(hikeSlug).then(() => {
      if (!deriveEndpoints()) throw new Error('Track file loaded but window.TRACK is empty');
      document.title = '3D photorealistic — ' + hikeSlug;
      if (currentMode === 'cesium') loadCesium();
      else                          loadMapLibre();
    }).catch((err) => {
      showError('Could not load hike data', err.message + '\n\nTry ?hike=zindlenspitz or ?hike=federispitz.');
    });
  </script>
</body>
</html>
