<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="proto-title" content="OSM Points of Interest">
<meta name="proto-icon" content="&#x1F4CD;">
<meta name="proto-desc" content="Query OpenStreetMap for hiker POIs: water, huts, shelters, viewpoints, parking">
<meta name="proto-source" content="Overpass API">
<meta name="proto-order" content="30">
<title>Overpass POI Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --board-bg: #1a1810;
    --board-surface: #242118;
    --flap-bg: #2c2820;
    --flap-border: #3a3428;
    --amber: #e8a832;
    --amber-dim: #b8862a;
    --amber-glow: #e8a83240;
    --text-primary: #f0e8d8;
    --text-secondary: #a89878;
    --text-muted: #786848;
    --font-display: 'Familjen Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--board-bg);
    color: var(--text-primary);
    font-family: var(--font-display);
    overflow: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
  }

  .layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  .header {
    background: var(--board-surface);
    border-bottom: 2px solid var(--flap-border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    background: var(--amber);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px var(--amber-glow);
  }

  .header-text h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .header-text p {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Input bar */
  .input-bar {
    background: var(--flap-bg);
    border-bottom: 1px solid var(--flap-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .field label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field input {
    background: var(--board-bg);
    border: 1px solid var(--flap-border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 6px 10px;
    width: 110px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: var(--amber);
  }

  .field-radius input {
    width: 70px;
  }

  .btn-search {
    background: var(--amber);
    color: var(--board-bg);
    border: none;
    border-radius: 4px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    align-self: flex-end;
    letter-spacing: 0.3px;
  }

  .btn-search:hover {
    background: var(--amber-dim);
  }

  .btn-search:active {
    transform: scale(0.97);
  }

  .btn-search:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    align-self: flex-end;
    padding-bottom: 2px;
    margin-left: auto;
  }

  .status.loading {
    color: var(--amber);
  }

  .status.error {
    color: #e63228;
  }

  /* Map area */
  .map-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* Override Leaflet popups for dark theme */
  .leaflet-popup-content-wrapper {
    background: var(--board-surface);
    color: var(--text-primary);
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid var(--flap-border);
  }

  .leaflet-popup-tip {
    background: var(--board-surface);
    border: 1px solid var(--flap-border);
    border-top: none;
    border-right: none;
  }

  .leaflet-popup-content {
    font-family: var(--font-display);
    font-size: 13px;
    margin: 10px 14px;
    line-height: 1.4;
  }

  .popup-type {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .popup-name {
    font-weight: 600;
    font-size: 14px;
  }

  .popup-tags {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .popup-tags span {
    display: block;
  }

  /* Legend panel */
  .legend {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: var(--board-surface);
    border: 1px solid var(--flap-border);
    border-radius: 8px;
    padding: 14px 18px;
    z-index: 500;
    min-width: 180px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .legend h3 {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 3px 0;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.15s;
  }

  .legend-item:hover {
    color: var(--text-primary);
  }

  .legend-item.hidden {
    opacity: 0.35;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-label {
    flex: 1;
    font-family: var(--font-display);
  }

  .legend-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    min-width: 20px;
    text-align: right;
  }

  /* Search radius circle */
  .search-radius {
    fill: var(--amber);
    fill-opacity: 0.06;
    stroke: var(--amber);
    stroke-opacity: 0.3;
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
  }

  /* Loading overlay */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(26, 24, 16, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .loading-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--flap-border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-text {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    margin-top: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Leaflet zoom controls dark theme */
  .leaflet-control-zoom a {
    background: var(--board-surface) !important;
    color: var(--text-primary) !important;
    border-color: var(--flap-border) !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--flap-bg) !important;
  }

  .leaflet-control-attribution {
    background: rgba(26, 24, 16, 0.8) !important;
    color: var(--text-muted) !important;
    font-size: 9px !important;
  }

  .leaflet-control-attribution a {
    color: var(--text-secondary) !important;
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1810" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="10" r="3"/>
        <path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 11.5 7.3 11.8a1 1 0 0 0 1.4 0C13 21.5 20 15.4 20 10a8 8 0 0 0-8-8z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Overpass POI Finder</h1>
      <p>OpenStreetMap points of interest for hikers</p>
    </div>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <div class="field">
      <label for="lat">Latitude</label>
      <input type="text" id="lat" value="47.0505">
    </div>
    <div class="field">
      <label for="lon">Longitude</label>
      <input type="text" id="lon" value="8.9531">
    </div>
    <div class="field field-radius">
      <label for="radius">Radius (km)</label>
      <input type="text" id="radius" value="2">
    </div>
    <button class="btn-search" id="btn-search" onclick="runSearch()">Search</button>
    <div class="status" id="status"></div>
  </div>

  <!-- Map -->
  <div class="map-wrap">
    <div id="map"></div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Querying Overpass API...</div>
    </div>

    <!-- Legend -->
    <div class="legend" id="legend">
      <h3>POI Types</h3>
      <div id="legend-items"></div>
    </div>
  </div>
</div>

<script>
// POI category definitions
var POI_TYPES = [
  {
    key: 'drinking_water',
    label: 'Drinking Water',
    color: '#4fc3f7',
    query: 'node["amenity"="drinking_water"]',
    matchFn: function(t) { return t.amenity === 'drinking_water'; }
  },
  {
    key: 'shelter',
    label: 'Shelters / Huts',
    color: '#ef5350',
    query: 'node["tourism"="alpine_hut"]\n  node["amenity"="shelter"]',
    matchFn: function(t) { return t.tourism === 'alpine_hut' || t.amenity === 'shelter'; }
  },
  {
    key: 'viewpoint',
    label: 'Viewpoints',
    color: '#ab47bc',
    query: 'node["tourism"="viewpoint"]',
    matchFn: function(t) { return t.tourism === 'viewpoint'; }
  },
  {
    key: 'parking',
    label: 'Parking',
    color: '#78909c',
    query: 'node["amenity"="parking"]',
    matchFn: function(t) { return t.amenity === 'parking'; }
  },
  {
    key: 'restaurant',
    label: 'Restaurants / Cafes',
    color: '#ffa726',
    query: 'node["amenity"="restaurant"]\n  node["amenity"="cafe"]',
    matchFn: function(t) { return t.amenity === 'restaurant' || t.amenity === 'cafe'; }
  },
  {
    key: 'bus_stop',
    label: 'Bus Stops',
    color: '#66bb6a',
    query: 'node["highway"="bus_stop"]',
    matchFn: function(t) { return t.highway === 'bus_stop'; }
  }
];

// Map setup
var map = L.map('map', {
  zoomControl: true
}).setView([47.0505, 8.9531], 14);

// SwissTopo base layer
L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
  attribution: '&copy; <a href="https://www.swisstopo.admin.ch/">swisstopo</a>',
  maxZoom: 18
}).addTo(map);

// Layer groups per POI type
var layerGroups = {};
POI_TYPES.forEach(function(pt) {
  layerGroups[pt.key] = L.layerGroup().addTo(map);
});

// Search radius circle
var searchCircle = null;

// Counts per type
var counts = {};

// Build legend
function buildLegend() {
  var container = document.getElementById('legend-items');
  container.innerHTML = '';
  POI_TYPES.forEach(function(pt) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    item.setAttribute('data-key', pt.key);

    var dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.backgroundColor = pt.color;

    var label = document.createElement('span');
    label.className = 'legend-label';
    label.textContent = pt.label;

    var count = document.createElement('span');
    count.className = 'legend-count';
    count.id = 'count-' + pt.key;
    count.textContent = counts[pt.key] !== undefined ? counts[pt.key] : '-';

    item.appendChild(dot);
    item.appendChild(label);
    item.appendChild(count);

    // Toggle visibility
    item.addEventListener('click', function() {
      var isHidden = item.classList.toggle('hidden');
      if (isHidden) {
        map.removeLayer(layerGroups[pt.key]);
      } else {
        map.addLayer(layerGroups[pt.key]);
      }
    });

    container.appendChild(item);
  });
}

buildLegend();

// Classify an element into a POI type
function classify(tags) {
  for (var i = 0; i < POI_TYPES.length; i++) {
    if (POI_TYPES[i].matchFn(tags)) return POI_TYPES[i];
  }
  return null;
}

// Format a human-readable type label from tags
function typeLabel(tags) {
  if (tags.amenity === 'drinking_water') return 'Drinking Water';
  if (tags.tourism === 'alpine_hut') return 'Alpine Hut';
  if (tags.amenity === 'shelter') return 'Shelter';
  if (tags.tourism === 'viewpoint') return 'Viewpoint';
  if (tags.amenity === 'parking') return 'Parking';
  if (tags.amenity === 'restaurant') return 'Restaurant';
  if (tags.amenity === 'cafe') return 'Cafe';
  if (tags.highway === 'bus_stop') return 'Bus Stop';
  return 'POI';
}

// Build popup content
function popupContent(el) {
  var tags = el.tags || {};
  var name = tags.name || '(unnamed)';
  var type = typeLabel(tags);
  var cat = classify(tags);
  var colorStr = cat ? cat.color : '#888';

  var html = '<div class="popup-type" style="color:' + colorStr + '">' + type + '</div>';
  html += '<div class="popup-name">' + escapeHtml(name) + '</div>';

  // Extra useful tags
  var extras = [];
  if (tags.ele) extras.push('Elevation: ' + tags.ele + ' m');
  if (tags.capacity) extras.push('Capacity: ' + tags.capacity);
  if (tags.opening_hours) extras.push('Hours: ' + tags.opening_hours);
  if (tags.operator) extras.push('Operator: ' + tags.operator);
  if (tags.fee) extras.push('Fee: ' + tags.fee);
  if (tags.wheelchair) extras.push('Wheelchair: ' + tags.wheelchair);

  if (extras.length > 0) {
    html += '<div class="popup-tags">';
    extras.forEach(function(e) {
      html += '<span>' + escapeHtml(e) + '</span>';
    });
    html += '</div>';
  }

  return html;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Set status
function setStatus(text, cls) {
  var el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

// Show/hide loading
function setLoading(active) {
  var overlay = document.getElementById('loading-overlay');
  if (active) {
    overlay.classList.add('active');
  } else {
    overlay.classList.remove('active');
  }
  document.getElementById('btn-search').disabled = active;
}

// Build the Overpass QL query
function buildQuery(lat, lon, radiusMeters) {
  var lines = ['[out:json][timeout:25];', '('];
  POI_TYPES.forEach(function(pt) {
    var parts = pt.query.split('\n');
    parts.forEach(function(p) {
      lines.push('  ' + p.trim() + '(around:' + radiusMeters + ',' + lat + ',' + lon + ');');
    });
  });
  lines.push(');');
  lines.push('out body;');
  return lines.join('\n');
}

// Run search
function runSearch() {
  var lat = parseFloat(document.getElementById('lat').value);
  var lon = parseFloat(document.getElementById('lon').value);
  var radiusKm = parseFloat(document.getElementById('radius').value);

  if (isNaN(lat) || isNaN(lon) || isNaN(radiusKm)) {
    setStatus('Invalid input values', 'error');
    return;
  }

  var radiusMeters = Math.round(radiusKm * 1000);
  var query = buildQuery(lat, lon, radiusMeters);

  // Clear existing markers
  POI_TYPES.forEach(function(pt) {
    layerGroups[pt.key].clearLayers();
    counts[pt.key] = 0;
  });

  // Update search circle
  if (searchCircle) {
    map.removeLayer(searchCircle);
  }
  searchCircle = L.circle([lat, lon], {
    radius: radiusMeters,
    className: 'search-radius',
    interactive: false
  }).addTo(map);

  // Center map
  map.setView([lat, lon], getZoomForRadius(radiusKm));

  // Show loading
  setLoading(true);
  setStatus('Querying Overpass API...', 'loading');
  var t0 = Date.now();

  // Send request
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://overpass-api.de/api/interpreter', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

  xhr.onload = function() {
    setLoading(false);
    if (xhr.status !== 200) {
      setStatus('HTTP error ' + xhr.status, 'error');
      return;
    }

    var data;
    try {
      data = JSON.parse(xhr.responseText);
    } catch (e) {
      setStatus('Invalid JSON response', 'error');
      return;
    }

    var elements = data.elements || [];
    var total = 0;

    elements.forEach(function(el) {
      if (!el.tags) return;
      var cat = classify(el.tags);
      if (!cat) return;

      counts[cat.key] = (counts[cat.key] || 0) + 1;
      total++;

      var marker = L.circleMarker([el.lat, el.lon], {
        radius: 7,
        fillColor: cat.color,
        fillOpacity: 0.85,
        color: '#fff',
        weight: 1.5,
        opacity: 0.6
      });

      marker.bindPopup(popupContent(el), { maxWidth: 260 });
      layerGroups[cat.key].addLayer(marker);
    });

    // Update legend counts
    POI_TYPES.forEach(function(pt) {
      var countEl = document.getElementById('count-' + pt.key);
      if (countEl) countEl.textContent = counts[pt.key] || 0;
    });

    var elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    setStatus(total + ' POIs found in ' + elapsed + 's');
  };

  xhr.onerror = function() {
    setLoading(false);
    setStatus('Network error — check your connection', 'error');
  };

  xhr.ontimeout = function() {
    setLoading(false);
    setStatus('Request timed out', 'error');
  };

  xhr.timeout = 30000;
  xhr.send('data=' + encodeURIComponent(query));
}

function getZoomForRadius(km) {
  if (km <= 0.5) return 16;
  if (km <= 1) return 15;
  if (km <= 2) return 14;
  if (km <= 5) return 13;
  if (km <= 10) return 12;
  if (km <= 20) return 11;
  return 10;
}

// Allow Enter key to trigger search
document.querySelectorAll('.field input').forEach(function(input) {
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') runSearch();
  });
});

// Click on map to set coordinates
map.on('click', function(e) {
  document.getElementById('lat').value = e.latlng.lat.toFixed(4);
  document.getElementById('lon').value = e.latlng.lng.toFixed(4);
});
</script>

</body>
</html>
