<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Peak Labels — Zindlenspitz</title>
<meta name="proto-title" content="3D Peak Labels (nearby named peaks)">
<meta name="proto-icon" content="&#x1F3D4;&#xFE0F;">
<meta name="proto-desc" content="Named peaks around the Zindlenspitz route as terrain-aware labels over the 3D SWISSIMAGE view. Default shows main summits within 10 km (~113); the pill toggle expands to every named peak in Switzerland (~7,500). Data from OpenStreetMap.">
<meta name="proto-source" content="OpenStreetMap peaks + swisstopo SWISSIMAGE + Terrarium DEM">
<meta name="proto-order" content="140">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --fg: #1a1a1a; --muted: #6b6b6b; --bg: #f6f6f4;
    --accent: #c0392b; --border: #e2e2dd;
    --panel: rgba(255,255,255,0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }

  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: #fff; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header a.back { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  header a.back:hover { text-decoration: underline; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

  #map { width: 100%; height: calc(100vh - 44px); position: relative; }

  /* Compact toggle pill — top-right of the map. Two states: main peaks / all peaks. */
  .peaks-toggle {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 0; border-radius: 999px;
    padding: 7px 14px 7px 12px;
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    cursor: pointer;
    transition: background 0.15s;
  }
  .peaks-toggle:hover { background: #ffffff; }
  .peaks-toggle.active { background: var(--accent); color: #fff; }
  .peaks-toggle.active .count { color: rgba(255,255,255,0.85); }
  .peaks-toggle .icon { font-size: 16px; line-height: 1; }
  .peaks-toggle .count {
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    header .meta { display: none; }
    .peaks-toggle { top: 8px; right: 8px; padding: 6px 12px 6px 10px; font-size: 12.5px; }
  }
</style>
<script data-goatcounter="https://roberthannah89.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <a class="back" href="index.html">← Prototypes</a>
  <h1>3D Peaks — Zindlenspitz</h1>
  <span class="meta">SWISSIMAGE on Terrarium DEM · click the pill to sweep every named peak in Switzerland onto the map</span>
</header>

<div id="map">
  <button class="peaks-toggle" id="peaks-toggle" title="Toggle: nearby main summits ↔ every named peak in Switzerland">
    <span class="icon" id="toggle-icon">&#x1F3D4;&#xFE0F;</span>
    <span id="toggle-label">Nearby peaks</span>
    <span class="count" id="toggle-count">—</span>
  </button>
</div>

<script src="../../routes/zindlenspitz/zindlenspitz.track.js"></script>
<script src="../../routes/zindlenspitz/proto-peaks.js"></script>
<script src="../../routes/zindlenspitz/proto-swiss-peaks.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";

  var TRAILHEAD = [8.9303, 47.0851];
  var SUMMIT    = [8.95987, 47.07627];
  var SUMMIT_NAME = "Zindlenspitz";

  // Filter out spot-elevation placeholders like "P.2860" — these are
  // OSM points with no real name, just an elevation. Not peaks in the
  // hiker's sense.
  var SPOT_ELE = /^P\.?\s*\d/;

  function tierFor(ele, notable) {
    ele = ele || 0;
    if (ele >= 2500 || (ele >= 2000 && notable)) return 1;
    if (ele >= 1800 || notable) return 2;
    return 3;
  }

  // Nearby feed — the 10 km buffer around this route. proto-peaks.js uses
  // long tag names (`name`, `ele`, `wikidata`, …).
  var NEARBY = (window.ROUTE_PEAKS && window.ROUTE_PEAKS.peaks || [])
    .filter(function (p) { return p.ele != null && !SPOT_ELE.test(p.name); })
    .filter(function (p) { return !!p.wikidata; });  // "main summits" only

  // Swiss-wide feed — proto-swiss-peaks.js uses compact keys (n/e/y/x/w).
  var SWISS = ((window.SWISS_PEAKS && window.SWISS_PEAKS.peaks) || [])
    .filter(function (p) { return p.e != null; });

  function nearbyFeatures() {
    return NEARBY.map(function (p) {
      return {
        type: "Feature",
        geometry: { type: "Point", coordinates: [p.lon, p.lat] },
        properties: {
          name: p.name,
          ele: p.ele,
          tier: tierFor(p.ele, !!p.wikidata),
          isSummit: p.name === SUMMIT_NAME
        }
      };
    });
  }

  function swissFeatures() {
    return SWISS.map(function (p) {
      return {
        type: "Feature",
        geometry: { type: "Point", coordinates: [p.x, p.y] },
        properties: {
          name: p.n,
          ele: p.e,
          tier: tierFor(p.e, !!p.w),
          isSummit: p.n === SUMMIT_NAME
        }
      };
    });
  }

  var FC_NEARBY = { type: "FeatureCollection", features: nearbyFeatures() };
  var FC_SWISS  = { type: "FeatureCollection", features: swissFeatures() };
  var COUNT_NEARBY = FC_NEARBY.features.length;
  var COUNT_SWISS  = FC_SWISS.features.length;

  var map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
      sources: {
        swissimage: {
          type: "raster",
          tiles: ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg"],
          tileSize: 256, maxzoom: 19,
          attribution: "&copy; swisstopo"
        },
        terrarium: {
          type: "raster-dem",
          tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
          tileSize: 256, maxzoom: 15, encoding: "terrarium",
          attribution: "Terrain: Mapzen / AWS Open Data"
        }
      },
      layers: [{ id: "satellite", type: "raster", source: "swissimage" }],
      terrain: { source: "terrarium", exaggeration: 1.5 },
      sky: { "sky-color": "#9fc8ec", "horizon-color": "#dfe7ed", "fog-color": "#dfe7ed", "fog-ground-blend": 0.5 }
    },
    center: [(TRAILHEAD[0] + SUMMIT[0]) / 2, (TRAILHEAD[1] + SUMMIT[1]) / 2],
    zoom: 12, pitch: 65, bearing: 35, maxPitch: 85, hash: false
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-left");
  map.addControl(new maplibregl.FullscreenControl(), "top-left");
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left");

  map.on("load", function () {
    var src = window.TRACK || [];
    if (src.length) {
      var coords = src.map(function (p) { return [p[1], p[0]]; });
      map.addSource("track", {
        type: "geojson",
        data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }
      });
      map.addLayer({
        id: "track-casing", type: "line", source: "track",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#1a1a1a", "line-width": 6, "line-opacity": 0.45 }
      });
      map.addLayer({
        id: "track-line", type: "line", source: "track",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#e74c3c", "line-width": 3.5 }
      });
      var lons = coords.map(function (c) { return c[0]; });
      var lats = coords.map(function (c) { return c[1]; });
      var pad = 0.03;
      var bounds = [
        [Math.min.apply(null, lons) - pad, Math.min.apply(null, lats) - pad],
        [Math.max.apply(null, lons) + pad, Math.max.apply(null, lats) + pad]
      ];
      map.fitBounds(bounds, { padding: 40, pitch: 60, bearing: 35, duration: 0 });
    }
    new maplibregl.Marker({ color: "#27ae60" }).setLngLat(TRAILHEAD)
      .setPopup(new maplibregl.Popup().setText("Trailhead"))
      .addTo(map);

    map.addSource("peaks", { type: "geojson", data: FC_NEARBY });

    map.addLayer({
      id: "peaks-dot",
      type: "circle",
      source: "peaks",
      paint: {
        "circle-radius": [
          "case",
          ["==", ["get", "isSummit"], true], 6,
          ["==", ["get", "tier"], 1], 4,
          ["==", ["get", "tier"], 2], 3.2,
          2.4
        ],
        "circle-color": [
          "case",
          ["==", ["get", "isSummit"], true], "#c0392b",
          "#ffffff"
        ],
        "circle-stroke-color": [
          "case",
          ["==", ["get", "isSummit"], true], "#ffffff",
          "#222222"
        ],
        "circle-stroke-width": [
          "case",
          ["==", ["get", "isSummit"], true], 2,
          1.3
        ]
      }
    });

    map.addLayer({
      id: "peaks-label",
      type: "symbol",
      source: "peaks",
      layout: {
        "text-field": ["concat", ["get", "name"], "  ", ["to-string", ["round", ["get", "ele"]]], " m"],
        "text-font": ["Open Sans Regular"],
        "text-size": [
          "case",
          ["==", ["get", "tier"], 1], 13,
          ["==", ["get", "tier"], 2], 11.5,
          10.5
        ],
        "text-anchor": "bottom",
        "text-offset": [0, -0.6],
        // Show every label — no collision culling. User asked for names
        // even when they overlap.
        "text-allow-overlap": true,
        "text-ignore-placement": true,
        // Draw high-elevation labels last so they render on top of any
        // shorter neighbours that happen to sit at the same pixel.
        "symbol-sort-key": ["-", 5000, ["get", "ele"]]
      },
      paint: {
        "text-color": "#1a1a1a",
        "text-halo-color": "#ffffff",
        "text-halo-width": 1.8,
        "text-halo-blur": 0.4
      }
    });

    applyMode();
  });

  // --- Toggle ------------------------------------------------------------
  // Two modes: "nearby" (main summits within 10 km, default) or "swiss"
  // (every named peak in Switzerland). Swaps the source's data on toggle.
  var mode = "nearby";
  var btn = document.getElementById("peaks-toggle");
  var iconEl = document.getElementById("toggle-icon");
  var labelEl = document.getElementById("toggle-label");
  var countEl = document.getElementById("toggle-count");

  function applyMode() {
    var src = map.getSource("peaks");
    if (src) src.setData(mode === "nearby" ? FC_NEARBY : FC_SWISS);
    if (mode === "nearby") {
      iconEl.innerHTML = "&#x1F3D4;&#xFE0F;";   // 🏔️
      labelEl.textContent = "Nearby peaks";
      countEl.textContent = COUNT_NEARBY;
      btn.classList.remove("active");
    } else {
      iconEl.innerHTML = "&#x26F0;&#xFE0F;";    // ⛰️
      labelEl.textContent = "All Swiss peaks";
      countEl.textContent = COUNT_SWISS.toLocaleString();
      btn.classList.add("active");
    }
  }

  btn.addEventListener("click", function () {
    mode = mode === "nearby" ? "swiss" : "nearby";
    applyMode();
  });

  countEl.textContent = COUNT_NEARBY;
})();
</script>

</body>
</html>
