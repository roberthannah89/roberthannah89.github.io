<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Peak Explorer prototype</title>
<meta name="proto-title" content="3D Peak Explorer (2D↔3D CC-shape)">
<meta name="proto-icon" content="&#x1F3D4;&#xFE0F;">
<meta name="proto-desc" content="Command Center's DOM + hike_map/ engine, with a [2D | 3D] toggle. 2D behavior is byte-identical to CC (same filter store, same side panel, same marker/cluster factories). 3D swaps the map surface to MapLibre with satellite + terrain, peaks colored by the minimum SAC T-grade needed to summit, huts as separate markers, SAC T1–T6 trails overlay. Designed as a genuine CC-replacement candidate — this prototype shares code so productionizing is a rename, not a port.">
<meta name="proto-source" content="hike_map/ engine · SAC_ROUTES · SwissTopo Topo+Trails / SWISSIMAGE + Terrarium · OSM Overpass">
<meta name="proto-order" content="110">

<!-- Fonts (same as CC) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Leaflet + MarkerCluster (2D mode) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- MapLibre (3D mode) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- App styles — reuse the engine + CC stylesheets verbatim so 2D mode is
     byte-identical to CC. 3d-peaks.css only adds the mode toggle chrome +
     right button stack + MapLibre dark chrome. -->
<link rel="stylesheet" href="../../templates/_assets/hike_map/marker_pill.css">
<link rel="stylesheet" href="../../routes/_assets/hike_popup.css">
<link rel="stylesheet" href="../../templates/_assets/hike_map/side_panel.css">
<link rel="stylesheet" href="../../command-center/command-center.css">
<link rel="stylesheet" href="3d-peaks/3d-peaks.css">

<script data-goatcounter="https://roberthannah89.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div id="app">
  <!-- Map (2D Leaflet or 3D MapLibre; renderer owns the container's contents) -->
  <div id="map"></div>

  <!-- Filter bar — same DOM as command-center; hike_map/ FilterBar populates
       #cc-filter-bar. Extra: #mode-toggle joins the tools cluster so it lives
       inline with ☰ / 🎛️ / 🔄. -->
  <div id="filter-bar">
    <div id="cc-tools" role="toolbar" aria-label="Page tools">
      <button id="nav-menu-btn" type="button" aria-expanded="false"
              aria-controls="nav-panel" title="Site menu">☰</button>
      <button id="chrome-toggle" type="button" aria-pressed="false"
              title="Hide filter controls (filters stay applied)">🎛️</button>
      <button id="refresh-btn" type="button"
              title="Refresh — reload the latest code &amp; data (bypasses cache)">🔄</button>
      <div id="mode-toggle" class="cc-mode-toggle" role="group" aria-label="Map mode">
        <button id="mode-2d" type="button" title="2D map (Leaflet)">2D</button>
        <button id="mode-3d" type="button" title="3D terrain (MapLibre)">3D</button>
      </div>
    </div>
    <div id="cc-filter-bar"></div>
  </div>

  <div id="hm-cross-page-banner"></div>

  <div id="bottom-bar">
    <div id="weather-toggles"></div>
    <div id="route-counter">
      <span id="route-count">Loading...</span>
      <button id="filter-reset" type="button" title="Reset all filters" hidden>Reset</button>
    </div>
    <div id="forecast-meta"></div>
  </div>

  <!-- Side panel (same as CC) -->
  <div id="side-panel"></div>

  <!-- 3D-only SAC grade legend, positioned above the info button and to the
       left of MapLibre's bottom-right zoom control. -->
  <div id="grade-legend" class="cc-grade-legend hidden">
    <h4>Min. T to summit</h4>
    <div class="row"><span class="sw t1"></span>T1 · Hiking</div>
    <div class="row"><span class="sw t2"></span>T2 · Mountain</div>
    <div class="row"><span class="sw t3"></span>T3 · Demanding mtn</div>
    <div class="row"><span class="sw t4"></span>T4 · Alpine</div>
    <div class="row"><span class="sw t5"></span>T5 · Demanding alpine</div>
    <div class="row"><span class="sw t6"></span>T6 · Difficult alpine</div>
    <div class="row"><span class="sw none"></span>Unclassified</div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>

  <!-- (i) info coach-marks — same button and wiring as CC. info-overlay.js
       (loaded below) auto-opens once per browser via localStorage. -->
  <button id="info-btn" type="button" aria-label="What does everything do?" title="What does everything do?">i</button>
</div>

<!-- Data — same as CC -->
<script src="../../routes/_assets/swiss_border.js"></script>
<script src="../../routes/_assets/map_shared.js"></script>
<script src="../../guides/sac-routes.js"></script>
<script src="../../hikes.js"></script>
<script src="../../command-center/cities.js"></script>
<script src="../../templates/_assets/hike_map/weather-cache.js"></script>
<script src="../../templates/_assets/hike_map/webcams_windy_data.js"></script>

<!-- All named Swiss peaks (7,512) for the 3D-only "peaks" toggle. -->
<script src="3d-trails/ch-peaks.js"></script>

<!-- hike_map engine — same load order as CC -->
<script src="../../templates/_assets/hike_map/grade_colors.js"></script>
<script src="../../templates/_assets/hike_map/weather.js"></script>
<script src="../../templates/_assets/hike_map/wx_lookup.js"></script>
<script src="../../templates/_assets/hike_map/day_picker.js"></script>
<script src="../../templates/_assets/hike_map/marker_factory.js"></script>
<script src="../../templates/_assets/hike_map/cluster_group.js"></script>
<script src="../../command-center/season.js"></script>
<script src="../../templates/_assets/hike_map/filter_store.js"></script>
<script src="../../templates/_assets/hike_map/filter_matcher.js"></script>
<script src="../../templates/_assets/hike_map/url_sync.js"></script>
<script src="../../templates/_assets/hike_map/filter_bar.js"></script>
<script src="../../routes/_assets/hike_popup.js"></script>
<script src="../../templates/_assets/hike_map/side_panel.js"></script>
<script src="../../templates/_assets/hike_map/webcams.js"></script>
<script src="../../templates/_assets/hike_map/slf_layer.js"></script>
<script src="../../command-center/overlays.js"></script>

<!-- 3d-peaks prototype -->
<script src="3d-peaks/renderer-2d.js"></script>
<script src="3d-peaks/renderer-3d.js"></script>
<script src="3d-peaks/orchestrator.js"></script>

<!-- (i) info coach-marks — same wiring as CC's #info-btn -->
<script src="../../command-center/info-overlay.js"></script>

<!-- Site nav dropdown (same as CC) -->
<script src="../../guides/_nav.js"></script>
<script src="../../command-center/nav-menu.js"></script>

</body>
</html>
