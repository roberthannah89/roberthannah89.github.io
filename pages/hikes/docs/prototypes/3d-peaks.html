<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Peak Labels — Zindlenspitz</title>
<meta name="proto-title" content="3D Peak Labels (nearby named peaks)">
<meta name="proto-icon" content="&#x1F3D4;&#xFE0F;">
<meta name="proto-desc" content="Named peaks within 10 km of the Zindlenspitz route, rendered as terrain-aware symbol labels over the 3D SWISSIMAGE view. Filter by elevation and Wikipedia-notable to control density; MapLibre auto-culls overlapping labels. Data from OpenStreetMap.">
<meta name="proto-source" content="OpenStreetMap peaks + swisstopo SWISSIMAGE + Terrarium DEM">
<meta name="proto-order" content="140">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --fg: #1a1a1a; --muted: #6b6b6b; --bg: #f6f6f4;
    --accent: #c0392b; --border: #e2e2dd;
    --panel: rgba(255,255,255,0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }

  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: #fff; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header a.back { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  header a.back:hover { text-decoration: underline; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

  #map { width: 100%; height: calc(100vh - 44px); position: relative; }

  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: var(--panel);
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    padding: 12px 14px;
    font-size: 12.5px;
    min-width: 240px;
    max-width: 300px;
  }
  .panel h2 {
    margin: 0 0 8px; font-size: 12.5px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px;
  }
  .panel .presets { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .preset-btn {
    flex: 1 1 auto;
    background: #f0efea; color: var(--fg); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: 4px;
    font: inherit; font-size: 11.5px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .preset-btn:hover { background: #e6e5df; }
  .preset-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .panel .row { margin-bottom: 10px; }
  .panel .row label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  .panel .row .val { color: var(--fg); font-weight: 600; }
  .panel input[type=range] { width: 100%; margin: 0; }
  .panel .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .panel .toggle input { margin: 0; cursor: pointer; }
  .panel .status {
    font-size: 11.5px; color: var(--muted);
    padding-top: 8px; border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .panel .status strong { color: var(--fg); font-weight: 600; }

  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    header .meta { display: none; }
    .panel { top: 8px; right: 8px; left: 8px; min-width: 0; max-width: none; }
  }
</style>
<script data-goatcounter="https://roberthannah89.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <a class="back" href="index.html">← Prototypes</a>
  <h1>3D Peaks — Zindlenspitz</h1>
  <span class="meta">Named peaks within 10 km · SWISSIMAGE on Terrarium DEM · symbol-layer labels (terrain-aware, auto-decluttered)</span>
</header>

<div id="map">
  <div class="panel">
    <h2>Filter</h2>
    <div class="presets" id="presets">
      <button class="preset-btn" data-preset="famous">Famous</button>
      <button class="preset-btn active" data-preset="high">Above 2000m</button>
      <button class="preset-btn" data-preset="mid">Above 1500m</button>
      <button class="preset-btn" data-preset="all">All</button>
    </div>

    <div class="row">
      <label>Minimum elevation: <span class="val" id="ele-val">2000 m</span></label>
      <input id="ele-slider" type="range" min="500" max="3000" step="50" value="2000">
    </div>

    <label class="toggle row">
      <input type="checkbox" id="wd-toggle">
      <span>Only Wikipedia-notable peaks</span>
    </label>

    <div class="status">
      Showing <strong id="shown-count">–</strong> of <strong id="total-count">–</strong> peaks
      <br>
      <span style="font-size:10.5px">10 km buffer · OpenStreetMap data</span>
    </div>
  </div>
</div>

<script src="../../routes/zindlenspitz/zindlenspitz.track.js"></script>
<script src="../../routes/zindlenspitz/proto-peaks.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";

  var TRAILHEAD = [8.9303, 47.0851];
  var SUMMIT    = [8.95987, 47.07627];
  var SUMMIT_NAME = "Zindlenspitz";

  var PEAKS = (window.ROUTE_PEAKS && window.ROUTE_PEAKS.peaks) || [];

  // Precompute tier + wikidata bool per peak so filter expressions can key off them.
  function tierFor(peak) {
    var ele = peak.ele || 0;
    var notable = !!peak.wikidata;
    if (ele >= 2500 || (ele >= 2000 && notable)) return 1;
    if (ele >= 1800 || notable) return 2;
    return 3;
  }

  function toGeoJSON(peaks) {
    return {
      type: "FeatureCollection",
      features: peaks
        .filter(function (p) { return p.ele != null; })
        .map(function (p) {
          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: [p.lon, p.lat] },
            properties: {
              name: p.name,
              ele: p.ele,
              tier: tierFor(p),
              wd: !!p.wikidata,
              isSummit: p.name === SUMMIT_NAME
            }
          };
        })
    };
  }

  var PEAKS_FC = toGeoJSON(PEAKS);

  var map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      // Glyphs for the symbol layer text — OpenMapTiles' public font server
      // (demotiles.maplibre.org lacks Open Sans Regular).
      glyphs: "https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
      sources: {
        swissimage: {
          type: "raster",
          tiles: ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg"],
          tileSize: 256, maxzoom: 19,
          attribution: "&copy; swisstopo"
        },
        terrarium: {
          type: "raster-dem",
          tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
          tileSize: 256, maxzoom: 15, encoding: "terrarium",
          attribution: "Terrain: Mapzen / AWS Open Data"
        }
      },
      layers: [{ id: "satellite", type: "raster", source: "swissimage" }],
      terrain: { source: "terrarium", exaggeration: 1.5 },
      sky: { "sky-color": "#9fc8ec", "horizon-color": "#dfe7ed", "fog-color": "#dfe7ed", "fog-ground-blend": 0.5 }
    },
    center: [(TRAILHEAD[0] + SUMMIT[0]) / 2, (TRAILHEAD[1] + SUMMIT[1]) / 2],
    zoom: 12, pitch: 65, bearing: 35, maxPitch: 85, hash: false
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-left");
  map.addControl(new maplibregl.FullscreenControl(), "top-left");
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left");

  map.on("load", function () {
    // --- Track ---
    var src = window.TRACK || [];
    if (src.length) {
      var coords = src.map(function (p) { return [p[1], p[0]]; });
      map.addSource("track", {
        type: "geojson",
        data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }
      });
      map.addLayer({
        id: "track-casing", type: "line", source: "track",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#1a1a1a", "line-width": 6, "line-opacity": 0.45 }
      });
      map.addLayer({
        id: "track-line", type: "line", source: "track",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#e74c3c", "line-width": 3.5 }
      });
      var lons = coords.map(function (c) { return c[0]; });
      var lats = coords.map(function (c) { return c[1]; });
      var pad = 0.03;
      var bounds = [
        [Math.min.apply(null, lons) - pad, Math.min.apply(null, lats) - pad],
        [Math.max.apply(null, lons) + pad, Math.max.apply(null, lats) + pad]
      ];
      map.fitBounds(bounds, { padding: 40, pitch: 60, bearing: 35, duration: 0 });
    }
    new maplibregl.Marker({ color: "#27ae60" }).setLngLat(TRAILHEAD)
      .setPopup(new maplibregl.Popup().setText("Trailhead"))
      .addTo(map);

    // --- Peaks: GeoJSON source + circle dots + symbol labels ---
    // Symbol layers project through terrain and auto-cull overlapping labels.
    map.addSource("peaks", { type: "geojson", data: PEAKS_FC });

    map.addLayer({
      id: "peaks-dot",
      type: "circle",
      source: "peaks",
      paint: {
        "circle-radius": [
          "case",
          ["==", ["get", "isSummit"], true], 6,
          ["==", ["get", "tier"], 1], 4.5,
          ["==", ["get", "tier"], 2], 3.5,
          2.5
        ],
        "circle-color": [
          "case",
          ["==", ["get", "isSummit"], true], "#c0392b",
          "#ffffff"
        ],
        "circle-stroke-color": [
          "case",
          ["==", ["get", "isSummit"], true], "#ffffff",
          "#222222"
        ],
        "circle-stroke-width": [
          "case",
          ["==", ["get", "isSummit"], true], 2,
          ["==", ["get", "tier"], 1], 1.5,
          1.2
        ]
      }
    });

    map.addLayer({
      id: "peaks-label",
      type: "symbol",
      source: "peaks",
      layout: {
        "text-field": ["concat", ["get", "name"], "  ", ["to-string", ["round", ["get", "ele"]]], " m"],
        "text-font": ["Open Sans Regular"],
        "text-size": [
          "case",
          ["==", ["get", "tier"], 1], 13,
          ["==", ["get", "tier"], 2], 11.5,
          10
        ],
        "text-anchor": "bottom",
        "text-offset": [0, -0.6],
        "text-allow-overlap": false,
        "text-optional": true,
        // Higher elevation = smaller sort key = higher rendering priority when culling.
        "symbol-sort-key": ["-", 5000, ["get", "ele"]]
      },
      paint: {
        "text-color": "#1a1a1a",
        "text-halo-color": "#ffffff",
        "text-halo-width": 1.8,
        "text-halo-blur": 0.5
      }
    });

    applyFilter();
  });

  // --- Filter --------------------------------------------------------------
  var totalCount = PEAKS_FC.features.length;

  function currentFilter() {
    var minEle = parseInt(document.getElementById("ele-slider").value, 10);
    var wdOnly = document.getElementById("wd-toggle").checked;
    var parts = [">=", ["get", "ele"], minEle];
    if (wdOnly) {
      return ["all", parts, ["==", ["get", "wd"], true]];
    }
    return parts;
  }

  function countMatching() {
    var minEle = parseInt(document.getElementById("ele-slider").value, 10);
    var wdOnly = document.getElementById("wd-toggle").checked;
    return PEAKS_FC.features.filter(function (f) {
      if (f.properties.ele < minEle) return false;
      if (wdOnly && !f.properties.wd) return false;
      return true;
    }).length;
  }

  function applyFilter() {
    if (!map.getLayer("peaks-label")) return;
    var f = currentFilter();
    map.setFilter("peaks-dot", f);
    map.setFilter("peaks-label", f);
    document.getElementById("shown-count").textContent = countMatching();
    document.getElementById("total-count").textContent = totalCount;
  }

  var PRESETS = {
    famous: { minEle: 2500, wd: false },
    high:   { minEle: 2000, wd: false },
    mid:    { minEle: 1500, wd: false },
    all:    { minEle: 500,  wd: false }
  };

  function applyPreset(key) {
    var p = PRESETS[key];
    if (!p) return;
    document.getElementById("ele-slider").value = p.minEle;
    document.getElementById("ele-val").textContent = p.minEle + " m";
    document.getElementById("wd-toggle").checked = p.wd;
    setActivePreset(key);
    applyFilter();
  }

  function setActivePreset(key) {
    document.querySelectorAll(".preset-btn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.preset === key);
    });
  }

  document.querySelectorAll(".preset-btn").forEach(function (b) {
    b.addEventListener("click", function () { applyPreset(b.dataset.preset); });
  });

  document.getElementById("ele-slider").addEventListener("input", function (e) {
    document.getElementById("ele-val").textContent = e.target.value + " m";
    setActivePreset(null);
    applyFilter();
  });

  document.getElementById("wd-toggle").addEventListener("change", function () {
    setActivePreset(null);
    applyFilter();
  });

  document.getElementById("total-count").textContent = totalCount;
})();
</script>

</body>
</html>
