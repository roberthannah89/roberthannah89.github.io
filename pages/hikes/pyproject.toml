[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "__pycache__",
    ".playwright-mcp",
    ".superpowers",
    "routes",
    "guides",
    "templates",
    "*.html",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
