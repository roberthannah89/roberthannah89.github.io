<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hike Command Center</title>

<!-- Guide nav metadata (auto-discovered by render_hike.py) -->
<meta name="guide-label" content="Command center">
<meta name="guide-card-title" content="Command center">
<meta name="guide-card-desc" content="Full-map dashboard with all hikes, weather layers, and canton/grade filters.">
<meta name="guide-order" content="5">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- App styles -->
<link rel="stylesheet" href="../templates/_assets/hike_map/marker_pill.css">
<link rel="stylesheet" href="../routes/_assets/hike_popup.css">
<link rel="stylesheet" href="../templates/_assets/hike_map/side_panel.css">
<link rel="stylesheet" href="command-center.css">
<script data-goatcounter="https://roberthannah89.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div id="app">
  <!-- Map -->
  <div id="map"></div>

  <!-- Filter bar (top left). Starts with a #cc-tools section that groups the
       three page-level controls (menu ☰, chrome-toggle 🎛️, refresh 🔄) into
       one pill so they don't visually compete with the filter groups that
       follow. Menu opens the guide dropdown built by nav-menu.js from
       window.HikesNav (published by ../guides/_nav.js); chrome-toggle hides
       every filter group (state stays); refresh unregisters the service
       worker and hard-reloads to bypass a stale cache. #cc-filter-bar is a
       `display: contents` wrapper (see command-center.css) so its children
       lay out as if they were direct #filter-bar flex items; HikeMap.
       FilterBar.mount() populates it via appendChild. -->
  <div id="filter-bar">
    <div id="cc-tools" role="toolbar" aria-label="Page tools">
      <button id="nav-menu-btn" type="button" aria-expanded="false"
              aria-controls="nav-panel" title="Site menu">☰</button>
      <button id="chrome-toggle" type="button" aria-pressed="false"
              title="Hide filter controls (filters stay applied)">🎛️</button>
      <button id="refresh-btn" type="button"
              title="Refresh — reload the latest code &amp; data (bypasses cache)">🔄</button>
    </div>
    <div id="cc-filter-bar"></div>
  </div>

  <!-- Cross-page filters banner (hike_map/url_sync.js#mountCrossPageBanner) —
       shown only when the URL hash carries filter keys this page's UI doesn't
       render (e.g. a hash minted on the index page's region/canton filters). -->
  <div id="hm-cross-page-banner"></div>

  <!-- Bottom-left horizontal strip: POI toggles · map switcher · destinations · forecast meta -->
  <div id="bottom-bar">
    <!-- POI / layer toggles (Hikes, SAC huts, Webcams, Names) -->
    <div id="weather-toggles"></div>
    <div id="route-counter">
      <span id="route-count">Loading...</span>
      <!-- Clears all filters + URL hash; visible whenever a filter is active -->
      <button id="filter-reset" type="button" title="Reset all filters" hidden>Reset</button>
    </div>
    <!-- .ms-layer-bar moves in here via JS after MapShared adds it -->
    <div id="forecast-meta"></div>
  </div>

  <!-- Side panel (slides in from right) -->
  <div id="side-panel"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>

  <!-- The (i) coach-mark button is NOT in the static markup any more —
       info-overlay.js attaches it as a Leaflet control inside
       .leaflet-top.leaflet-right after boot, so it stacks with any native
       Leaflet controls (zoom / fullscreen) instead of floating on top of
       them. See info-overlay.js#attachInfoButton. -->
</div>

<!--
  All app JS is loaded as plain <script> tags (no `type="module"`) so the page
  works under `file://` as well as via http(s). Each module IIFE-wraps itself
  and exposes a single window.* global (e.g. window.WeatherService,
  window.SlfLayer); command-center.js orchestrates them via those globals.

  Lazy-loaded caches (NOT listed here):
  - slf-cache.js (0 KB off-season, ~50 KB in winter): the avalanche overlay is
    always on (no toggle — safety layer), but the ~50 KB winter blob still
    lazy-loads via a dynamic <script> tag inside SlfLayer.create(), called
    unconditionally at boot by bootAvalancheLayer() in command-center.js
    (same lazy-load pattern as webcams, just triggered at boot not on click).
-->
<!-- Data -->
<script src="../routes/_assets/swiss_border.js"></script>
<script src="../routes/_assets/map_shared.js"></script>
<script src="../guides/sac-routes.js"></script>
<script src="../hikes.js"></script>
<script src="cities.js"></script>
<script src="../templates/_assets/hike_map/weather-cache.js"></script>
<script src="../templates/_assets/hike_map/webcams_windy_data.js"></script>

<!-- App modules -->
<!-- slf-cache.js (0 KB off-season, ~50 KB in winter): the avalanche overlay
     auto-loads at boot (no toggle). Lazy-loaded inside SlfLayer.create via
     a dynamic <script> tag, same pattern as the windy webcam data. -->
<script src="../templates/_assets/hike_map/grade_colors.js"></script>
<script src="../templates/_assets/hike_map/weather.js"></script>
<script src="../templates/_assets/hike_map/wx_lookup.js"></script>
<script src="../templates/_assets/hike_map/day_picker.js"></script>
<script src="../templates/_assets/hike_map/marker_factory.js"></script>
<script src="../templates/_assets/hike_map/cluster_group.js"></script>
<script src="season.js"></script>
<script src="../templates/_assets/hike_map/filter_store.js"></script>
<script src="../templates/_assets/hike_map/filter_matcher.js"></script>
<script src="../templates/_assets/hike_map/url_sync.js"></script>
<script src="../templates/_assets/hike_map/filter_bar.js"></script>
<script src="../routes/_assets/hike_popup.js"></script>
<script src="../templates/_assets/hike_map/side_panel.js"></script>
<script src="../templates/_assets/hike_map/webcams.js"></script>
<script src="../templates/_assets/hike_map/slf_layer.js"></script>
<script src="overlays.js"></script>
<script src="command-center.js"></script>
<script src="info-overlay.js"></script>

<!-- Site nav pill: reveals the horizontal guide nav on click. Loads
     ../guides/_nav.js purely to consume its window.HikesNav data (no
     .crumbs element here, so its auto-inject branch no-ops). -->
<script src="../guides/_nav.js"></script>
<script src="nav-menu.js"></script>

</body>
</html>
