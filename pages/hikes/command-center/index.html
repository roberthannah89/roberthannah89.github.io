<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hike Command Center</title>

<!-- Guide nav metadata (auto-discovered by render_hike.py) -->
<meta name="guide-label" content="Command center">
<meta name="guide-card-title" content="Command center">
<meta name="guide-card-desc" content="Full-map dashboard with all hikes, weather layers, and canton/grade filters.">
<meta name="guide-order" content="5">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- App styles -->
<link rel="stylesheet" href="command-center.css">
</head>
<body>

<div id="app">
  <!-- Map -->
  <div id="map"></div>

  <!-- Filter bar (top left) -->
  <div id="filter-bar"></div>

  <!-- Bottom-left horizontal strip: POI toggles · map switcher · destinations · forecast meta -->
  <div id="bottom-bar">
    <!-- POI / layer toggles (Hikes, SAC huts, Webcams, Names) -->
    <div id="weather-toggles"></div>
    <div id="route-counter">
      <span id="route-count">Loading...</span>
      <!-- Clears all filters + URL hash; visible whenever a filter is active -->
      <button id="filter-reset" type="button" title="Reset all filters" hidden>Reset</button>
    </div>
    <!-- Copy the current URL (with hash state) to clipboard -->
    <button id="share-link" type="button" title="Copy link to this view">Share</button>
    <!-- .ms-layer-bar moves in here via JS after MapShared adds it -->
    <div id="forecast-meta"></div>
  </div>

  <!-- Side panel (slides in from right) -->
  <div id="side-panel"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loading-text">Loading...</div>
  </div>
</div>

<!-- Data -->
<script src="../routes/_assets/swiss_border.js"></script>
<script src="../routes/_assets/map_shared.js"></script>
<script src="../guides/sac-routes.js"></script>
<script src="../hikes.js"></script>
<script src="weather-cache.js"></script>
<script src="webcams_windy_data.js"></script>

<!-- App modules -->
<script src="weather.js"></script>
<script src="url-sync.js"></script>
<script src="filters.js"></script>
<script src="side-panel.js"></script>
<script src="webcams.js"></script>
<script src="command-center.js"></script>

</body>
</html>
