name: Claude

# Reacts to @claude mentions on issues, issue comments, and PR review
# comments. The claude-code-action reads the mention, runs Claude with
# repo checkout access, and posts a reply comment.
#
# Auth: uses the CLAUDE_CODE_OAUTH_TOKEN secret written by
# `/install-github-app`. Rotate via the same command.
#
# Scope: contents: read (checkout), issues + pull-requests: write (reply),
# id-token: write (OIDC for the action). Nothing else needed for a
# comment-based Q&A flow.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# Gate on @claude mention so PR/issue opens without one don't burn a run.
# Matches the mention anywhere in the comment or opening body.
jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment'                && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment'  && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues'                       && contains(github.event.issue.body,   '@claude')) ||
      (github.event_name == 'pull_request'                 && contains(github.event.pull_request.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
