name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 3 hours — matches MeteoSwiss ICON-CH2 run cadence
    - cron: '15 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── plan ───────────────────────────────────────────────────────────────
  # Cheap job: figure out (a) whether hike pages need re-rendering and
  # (b) which 3-hour weather bucket we're in. Fans out to weather + render.
  plan:
    runs-on: ubuntu-latest
    outputs:
      needs_render: ${{ steps.scope.outputs.needs_render }}
      weather_key: ${{ steps.bucket.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # need previous commit for the change-scope diff

      - name: Detect change scope
        id: scope
        run: |
          # Schedule + workflow_dispatch always rebuild (weather refresh / explicit trigger).
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "needs_render=true" >> $GITHUB_OUTPUT
            echo "Trigger: ${{ github.event_name }} — full build"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "needs_render=true" >> $GITHUB_OUTPUT
            echo "No base ref — defaulting to full build"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "needs_render=false" >> $GITHUB_OUTPUT
            echo "No diff — skipping render"
            exit 0
          fi
          echo "Changed since $base:"; echo "$changed" | sed 's/^/  /'
          # Paths that DO NOT require re-rendering hike pages:
          #   * gallery / API-docs prototypes  — committed HTML, no template build
          #   * workflow + READMEs              — meta files
          skippable='^(pages/hikes/docs/|\.github/|README|\.gitignore$)'
          render_needed=$(echo "$changed" | grep -vE "$skippable" || true)
          if [ -z "$render_needed" ]; then
            echo "needs_render=false" >> $GITHUB_OUTPUT
            echo "Result: docs/prototype-only — skipping hike-page render (~1-2 min saved)"
          else
            echo "needs_render=true" >> $GITHUB_OUTPUT
            echo "Result: substantive change — running full build"
          fi

      - name: Compute 3-hour weather bucket
        id: bucket
        run: |
          H=$(date -u +'%-H')
          BUCKET=$(( H / 3 * 3 ))
          KEY="weather-$(date -u +'%Y%m%d')-$(printf '%02d' $BUCKET)"
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "Weather bucket: $KEY"

  # ─── weather (parallel with render) ─────────────────────────────────────
  # Refresh keeps critical path off push builds:
  #   * schedule / workflow_dispatch on cache-miss  → fetch fresh (~6 min).
  #   * cache-hit                                    → reuse in ~5 s.
  #   * push on cache-miss                           → skip fetch; ship
  #     whatever weather-cache.js is already checked in (up to ~3 h old,
  #     since the cron at xx:15 refreshes every bucket). The ~6-min fetch
  #     is intentionally kept off the deploy critical path — pushes ship
  #     code changes fast, and the cron handles weather refresh async.
  weather:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore weather cache
        id: weather-cache
        uses: actions/cache@v6
        with:
          path: pages/hikes/command-center/weather-cache.js
          key: ${{ needs.plan.outputs.weather_key }}

      - name: Decide whether to fetch fresh weather
        id: decide
        run: |
          if [ "${{ steps.weather-cache.outputs.cache-hit }}" = "true" ]; then
            echo "fetch=false" >> $GITHUB_OUTPUT
            echo "Cache hit — reusing bucket ${{ needs.plan.outputs.weather_key }}"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fetch=true" >> $GITHUB_OUTPUT
            echo "Cache miss on ${{ github.event_name }} — refreshing weather"
          else
            echo "fetch=false" >> $GITHUB_OUTPUT
            echo "Cache miss on push — reusing committed weather-cache.js (next cron xx:15 refreshes)"
          fi

      - uses: actions/setup-python@v6
        if: steps.decide.outputs.fetch == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pages/hikes/requirements.txt

      - name: Install dependencies
        if: steps.decide.outputs.fetch == 'true'
        run: pip install -r pages/hikes/requirements.txt

      - name: Fetch weather forecasts (MeteoSwiss ICON-CH2 via Open-Meteo)
        if: steps.decide.outputs.fetch == 'true'
        run: cd pages/hikes && python scripts/fetch_weather.py

      - name: Upload weather cache
        uses: actions/upload-artifact@v7
        with:
          name: weather-cache
          path: pages/hikes/command-center/weather-cache.js
          if-no-files-found: error
          retention-days: 1

  # ─── render (parallel with weather) ─────────────────────────────────────
  # Regenerates hike pages, gallery, and guides from templates + data.
  # Skipped entirely for docs/prototype-only pushes (see plan.needs_render).
  render:
    needs: plan
    if: needs.plan.outputs.needs_render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pages/hikes/requirements.txt

      - name: Install dependencies
        run: pip install -r pages/hikes/requirements.txt

      - name: Validate hike file completeness
        run: cd pages/hikes && python scripts/validate_hike_files.py

      - name: Validate hike data
        run: cd pages/hikes && python scripts/render_hike.py --validate-only

      - name: Render hike pages
        run: cd pages/hikes && python scripts/render_hike.py

      # Upload only the generated files. Least common ancestor is
      # `pages/hikes/`, so download into `pages/hikes/` to restore paths.
      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: rendered-site
          path: |
            pages/hikes/routes/**/*.html
            pages/hikes/routes/**/*.track.js
            pages/hikes/routes/_assets/**
            pages/hikes/index.html
            pages/hikes/guides/difficulty.html
            pages/hikes/guides/_nav.js
          if-no-files-found: error
          retention-days: 1

  # ─── deploy ─────────────────────────────────────────────────────────────
  # Fans in: checkout the tree, overlay fresh weather + rendered artifacts,
  # inject secret-derived config, ship to GitHub Pages.
  deploy:
    needs: [plan, weather, render]
    # `render` may be skipped on docs-only pushes — allow that but require weather to succeed.
    if: |
      always()
      && needs.weather.result == 'success'
      && (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download weather cache
        uses: actions/download-artifact@v8
        with:
          name: weather-cache
          path: pages/hikes/command-center/

      - name: Download rendered site
        if: needs.plan.outputs.needs_render == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rendered-site
          path: pages/hikes/

      - name: Inject site-local config (API keys etc) from repo secrets
        env:
          GMAPS_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}
        run: |
          if [ -n "$GMAPS_KEY" ]; then
            printf 'window.HIKING_CONFIG = { googleMapsApiKey: "%s" };\n' "$GMAPS_KEY" > pages/hikes/local-config.js
            echo "Wrote pages/hikes/local-config.js (key value hidden)"
          else
            echo "GOOGLE_MAPS_EMBED_KEY secret not set — skipping local-config.js"
            echo "(transit widget will show setup instructions in 'Compare with Google Maps' pane)"
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
