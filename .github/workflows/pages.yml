name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 3 hours — matches MeteoSwiss ICON-CH2 run cadence
    - cron: '15 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pages/hikes/requirements.txt

      - name: Fetch weather forecasts (MeteoSwiss ICON-CH2 via Open-Meteo)
        run: cd pages/hikes && python scripts/fetch_weather.py

      - name: Validate hike file completeness
        run: cd pages/hikes && python scripts/validate_hike_files.py

      - name: Validate hike data
        run: cd pages/hikes && python scripts/render_hike.py --validate-only

      - name: Render hike pages
        run: cd pages/hikes && python scripts/render_hike.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
